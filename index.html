<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coloring Park">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#fff7ec">
<title>Juniper's Coloring Park</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Avenir Next","Nunito","Trebuchet MS",system-ui,sans-serif;background:#fff7ec;color:#3b2a20}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
/* home */
#home{flex-direction:column;align-items:center;overflow-y:auto;padding:14px 16px 30px}
.homebar{display:flex;align-items:center;gap:14px;width:100%;max-width:1100px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(20px,3.4vw,34px);color:#e0631a}
.logo svg{width:64px;height:64px}
.modes{display:flex;gap:10px}
.bigbtn{width:72px;height:72px;border-radius:22px;background:#fff;box-shadow:0 4px 0 #e8d3bd,0 6px 14px rgba(120,70,20,.15);display:grid;place-items:center;transition:transform .12s}
.bigbtn:active{transform:scale(.92)}
.bigbtn svg{width:46px;height:46px}
.bigbtn.sel{background:#ffe2b8;box-shadow:0 4px 0 #f0a64a,0 0 0 4px #f57c00 inset}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;width:100%;max-width:1100px;margin-top:16px}
.card{background:#fff;border-radius:22px;padding:8px;box-shadow:0 4px 0 #e8d3bd,0 8px 18px rgba(120,70,20,.12);position:relative;transition:transform .12s}
.card:active{transform:scale(.95)}
.card img{width:100%;aspect-ratio:4/3;display:block;border-radius:14px;background:#fff}
.card .cap{font-size:13px;color:#8a6a55;text-align:center;padding-top:4px;font-weight:700}
.card .badge{position:absolute;right:10px;top:10px;width:34px;height:34px}
/* paint screen */
#paint{flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:3;flex-wrap:wrap}
.topbar .sp{flex:1}
.tb{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#fff6ea;box-shadow:0 3px 0 #ead6bf}
.tb svg{width:38px;height:38px}
.tb:active{transform:scale(.9)}
.tb.off{opacity:.45}
.tb.done{background:#ffd54f;box-shadow:0 3px 0 #e0a800;width:72px}
.mid{flex:1;display:flex;min-height:0}
.tools{display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto;background:#fffaf3}
.tool{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#fff;box-shadow:0 3px 0 #ead6bf;flex:none}
.tool svg{width:46px;height:46px}
.tool.sel{background:#ffe2b8;box-shadow:0 0 0 4px #f57c00 inset}
.sizes{display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:4px}
.size{width:64px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #ead6bf;flex:none}
.size.sel{background:#ffe2b8;box-shadow:0 0 0 4px #f57c00 inset}
.size i{display:block;border-radius:50%;background:#3b2a20}
#stage{flex:1;position:relative;display:grid;place-items:center;min-width:0;padding:8px}
#board{position:relative;aspect-ratio:4/3;max-width:100%;max-height:100%;width:100%;background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(120,70,20,.18);overflow:hidden;touch-action:none}
#board canvas{position:absolute;inset:0;width:100%;height:100%}
#cv-lines,#cv-nums,#cv-stick{pointer-events:none}
.palette{width:150px;padding:8px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;background:#fffaf3}
.sw{position:relative;aspect-ratio:1;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.12);border:3px solid #fff;transition:transform .1s}
.sw.sel{transform:scale(1.08);box-shadow:0 0 0 4px #3b2a20,0 3px 0 rgba(0,0,0,.18)}
.sw .es{position:absolute;left:-6px;right:-6px;bottom:-15px;font-size:10px;font-weight:800;text-align:center;color:#6b5040;pointer-events:none;white-space:nowrap}
.sw .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.sw.doneN::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="30" cy="10" r="9" fill="%2343a047" stroke="white" stroke-width="2"/><path d="M25 10l4 4 6-7" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/></svg>') no-repeat center/100%}
.palette.withnames{row-gap:22px}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.stickers{display:none;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:8px}
.stk{aspect-ratio:1;border-radius:16px;background:#fff;box-shadow:0 3px 0 #ead6bf;display:grid;place-items:center}
.stk img{width:78%;height:78%}
.stk.sel{background:#ffe2b8;box-shadow:0 0 0 4px #f57c00 inset}
@media (orientation:portrait){
  .mid{flex-direction:column}
  .tools{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .sizes{flex-direction:row;padding:0}
  .palette{width:auto;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));max-height:30vh}
  .stickers{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
}
/* overlays */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.overlay{position:fixed;inset:0;background:rgba(255,247,236,.78);display:none;place-items:center;z-index:15}
.overlay.on{display:grid}
.cele{background:#fff;border-radius:30px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center;max-width:90vw}
.cele img{width:min(480px,70vw);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.cele .row{display:flex;gap:16px;justify-content:center;margin-top:14px}
.stars3{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.stars3 svg{width:60px;height:60px;animation:pop .6s both}
.stars3 svg:nth-child(2){animation-delay:.2s;width:80px;height:80px}.stars3 svg:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
#gallery{flex-direction:column;align-items:center;overflow-y:auto;padding:14px 16px 30px}
.empty{margin-top:60px;opacity:.6}
.empty svg{width:160px;height:160px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff;border-radius:20px;padding:8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:30;display:none}
.toast svg{width:44px;height:44px;display:block}

.card.locked img{filter:grayscale(1) blur(1.5px) opacity(.3)}
.card.locked::after{content:'🔒';position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-size:44px}
.card.locked .lockcap{font-size:14px;line-height:1.15;color:#6a4a7a}
.card.nope{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.card{position:relative}
.wtag{position:absolute;top:8px;left:8px;font-size:12px;font-weight:900;color:#fff;padding:2px 8px;border-radius:10px;background:#8e24aa}
.wtag.w-nyc{background:#1e88e5}.wtag.w-vail{background:#26a3c9}.wtag.w-sc{background:#f57c00}.wtag.w-pr{background:#43a047}
.scene-cele{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(40,20,60,.55)}
.scene-cele.on{display:flex}
.sc-card{position:relative;background:#fff;border-radius:30px;border:5px solid #222;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:scPop .6s cubic-bezier(.2,1.4,.4,1) both;max-width:86vw}
.sc-card b{font-size:30px;color:#e91e63}.sc-card img{width:min(60vw,420px);border-radius:18px;border:4px solid #222}.sc-card span{font-weight:800;font-size:20px}
.sc-go{font:inherit;font-weight:900;font-size:22px;padding:10px 28px;border-radius:24px;border:4px solid #222;background:#fdd835}
.sc-x{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:4px solid #222;background:#fff;font-size:22px;font-weight:900}
.sc-burst{position:absolute;inset:-40px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(#fdd835 0 10deg,#fff0 10deg 20deg);animation:spin 8s linear infinite;opacity:.6}
@keyframes scPop{0%{transform:scale(.3) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="home" class="screen on">
  <div class="homebar">
    <div class="logo"><span id="logoFox"></span><span>Juniper's Coloring Park</span></div>
    <div class="modes">
      <button class="bigbtn sel" id="modeFree" aria-label="Free coloring"></button>
      <button class="bigbtn" id="modeNum" aria-label="Color by number"></button>
      <button class="bigbtn" id="openGallery" aria-label="My gallery"></button>
      <a class="bigbtn" id="toLearn" href="learn/" aria-label="Juniper's Learning Park"></a>
    </div>
  </div>
  <div class="grid" id="pageGrid"></div>
</div>
<div id="paint" class="screen">
  <div class="topbar">
    <button class="tb" id="bHome" aria-label="Home"></button>
    <button class="tb" id="bUndo" aria-label="Undo"></button>
    <button class="tb" id="bRedo" aria-label="Redo"></button>
    <button class="tb" id="bMagic" aria-label="Stay inside the lines"></button>
    <button class="tb" id="bClear" aria-label="Start over"></button>
    <span class="sp"></span>
    <button class="tb" id="bSpeak" aria-label="Spanish color names"></button>
    <button class="tb" id="bSound" aria-label="Sound"></button>
    <button class="tb done" id="bDone" aria-label="Finished!"></button>
  </div>
  <div class="mid">
    <div class="tools" id="tools"></div>
    <div id="stage"><div id="board">
      <canvas id="cv-paint" width="1024" height="768"></canvas>
      <canvas id="cv-lines" width="1024" height="768"></canvas>
      <canvas id="cv-stick" width="1024" height="768"></canvas>
      <canvas id="cv-nums" width="1024" height="768"></canvas>
    </div></div>
    <div class="palette withnames" id="palette"></div>
  </div>
</div>
<div id="gallery" class="screen">
  <div class="homebar"><button class="bigbtn" id="gHome" aria-label="Home"></button><div class="logo"><span id="galIcon"></span></div><span style="width:72px"></span></div>
  <div class="grid" id="galGrid"></div>
</div>
<div class="overlay" id="celebrate"><div class="cele">
  <div class="stars3" id="cStars"></div><img id="cImg" alt="">
  <div class="row"><button class="bigbtn" id="cDown" aria-label="Download picture"></button><button class="bigbtn" id="cGal" aria-label="Gallery"></button><button class="bigbtn" id="cMore" aria-label="Keep coloring"></button><button class="bigbtn" id="cHome" aria-label="Home"></button></div>
</div></div>
<div class="overlay" id="viewer"><div class="cele">
  <img id="vImg" alt="">
  <div class="row"><button class="bigbtn" id="vDown" aria-label="Download picture"></button><button class="bigbtn" id="vDel" aria-label="Delete"></button><button class="bigbtn" id="vClose" aria-label="Close"></button></div>
</div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<script>// Juniper's Coloring Park - original line art (vector, drawn for Aspen). Not copied from any app.
const PALETTE = [
  ['rojo','red','#e53935'],['naranja','orange','#f57c00'],['amarillo','yellow','#fdd835'],
  ['verde lima','lime','#c0ca33'],['verde','green','#43a047'],['verde oscuro','dark green','#2e7d32'],
  ['turquesa','turquoise','#26c6da'],['celeste','sky blue','#81d4fa'],['azul','blue','#1e88e5'],
  ['azul marino','navy','#3949ab'],['morado','purple','#8e24aa'],['lila','lilac','#ce93d8'],
  ['rosa','pink','#f48fb1'],['fucsia','magenta','#e91e63'],['melocotón','peach','#ffcc99'],
  ['crema','cream','#fbe7c8'],['canela','tan','#c68642'],['marrón','brown','#8d5524'],
  ['marrón oscuro','dark brown','#5d4037'],['gris claro','light gray','#cfd8dc'],['gris','gray','#90a4ae'],
  ['negro','black','#3d3a45'],['blanco','white','#ffffff']
];
const ART = (() => {
const c = {}; PALETTE.forEach(p => c[p[0].replace(/ /g,'_').replace('ó','o')] = p[2]);
const K = '#222', Wh = c.blanco;
const n = v => Math.round(v*10)/10;
const E=(cx,cy,rx,ry,f=Wh,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${x}/>`;
const C=(cx,cy,r,f=Wh,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${x}/>`;
const P=(d,f='none',x='')=>`<path d="${d}" fill="${f}" ${x}/>`;
const R=(x,y,w,h,r,f=Wh,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${ex}/>`;
const L=(x1,y1,x2,y2,ex='')=>`<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" ${ex}/>`;
const G=(tx,ty,s,inner,rot=0,flip=false)=>`<g transform="translate(${tx} ${ty}) rotate(${rot}) scale(${flip?-s:s} ${s})">${inner}</g>`;
const HL=(cx,cy,r)=>C(cx,cy,r,Wh,'stroke="none"');
let clipN=0;
function scallop(cx,cy,rx,ry,nb,bump=0.18,rot=0){
  const pts=[];for(let i=0;i<nb;i++){const a=rot+i/nb*2*Math.PI;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}
  let d=`M${n(pts[0][0])} ${n(pts[0][1])}`;const k=1+bump*2;
  for(let i=0;i<nb;i++){const a=rot+(i+0.5)/nb*2*Math.PI;const p=pts[(i+1)%nb];
    d+=` Q${n(cx+rx*k*Math.cos(a))} ${n(cy+ry*k*Math.sin(a))} ${n(p[0])} ${n(p[1])}`;}
  return d+'Z';
}
function starD(cx,cy,r1,r2,np=5,rot=-90){let d='';for(let i=0;i<np*2;i++){const r=i%2?r2:r1,a=(rot+i*180/np)*Math.PI/180;
  d+=(i?'L':'M')+n(cx+r*Math.cos(a))+' '+n(cy+r*Math.sin(a))+' ';}return d+'Z';}
const svg=inner=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768"><g stroke="${K}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
// ---------- scenery ----------
const frame=sky=>R(6,6,1012,756,28,sky);
const ground=(y,f,amp=24)=>P(`M6 ${y} Q 256 ${y-amp} 512 ${y} T 1018 ${y} L1018 734 Q1018 762 990 762 L34 762 Q6 762 6 734 Z`,f);
const cloud=(x,y,s=1)=>P(scallop(x,y,70*s,32*s,8,0.22),Wh);
const sun=(x,y,r=46)=>{let s='';for(let i=0;i<10;i++){const a=i*36*Math.PI/180;s+=L(n(x+(r+12)*Math.cos(a)),n(y+(r+12)*Math.sin(a)),n(x+(r+30)*Math.cos(a)),n(y+(r+30)*Math.sin(a)));}
  return s+C(x,y,r,c.amarillo)+E(x-15,y-6,5,7,K,'stroke="none"')+E(x+15,y-6,5,7,K,'stroke="none"')+P(`M${x-16} ${y+12} Q${x} ${y+26} ${x+16} ${y+12}`);};
const tree=(x,y,s=1,leaf=c.verde)=>R(x-14*s,y-90*s,28*s,90*s,8,c.marron)+P(scallop(x,y-150*s,80*s,70*s,9,0.16),leaf)+P(`M${x-30*s} ${y-150*s} q15 -15 30 0`)+P(`M${x+10*s} ${y-180*s} q12 -12 24 0`);
const bush=(x,y,s=1,f=c.verde)=>P(scallop(x,y,60*s,30*s,7,0.2),f);
const flower=(x,y,f=c.rosa,s=1)=>L(x,y,x,y+40*s)+P(`M${x} ${y+30*s} q-18 -14 -24 2 q14 8 24 -2Z`,c.verde)+P(scallop(x,y,16*s,16*s,5,0.35),f)+C(x,y,6*s,c.amarillo);
const grassTufts=(pts)=>pts.map(([x,y])=>P(`M${x-10} ${y} q4 -14 6 -18 M${x} ${y} q0 -16 2 -22 M${x+10} ${y} q-2 -14 -6 -18`)).join('');
const heart=(x,y,s=1,f=c.rojo)=>P(`M${x} ${y+18*s} C${x-40*s} ${y-8*s} ${x-18*s} ${y-34*s} ${x} ${y-14*s} C${x+18*s} ${y-34*s} ${x+40*s} ${y-8*s} ${x} ${y+18*s} Z`,f);
const acorn=(x,y,s=1)=>G(x,y,s,E(0,10,16,20,c.canela)+R(-3,-30,6,14,3,c.marron_oscuro)+P('M-21 2 Q-22 -20 0 -20 Q22 -20 21 2 Z',c.marron)+P('M-12 -4 l6 -8 M0 -4 l6 -8 M10 -2 l5 -7'));
const carnation=(x,y,s=1)=>G(x,y,s,P('M0 18 Q4 40 0 60')+P('M0 40 q-18 -10 -22 4 q14 6 22 -4Z',c.verde)+P(scallop(0,0,22,18,11,0.22),c.verde_lima)+P(scallop(0,-2,12,9,7,0.25),c.verde));
// ---------- characters ----------
const FOX=c.naranja, CR=c.crema, SOCK=c.marron_oscuro;
function foxHead(o={}){
  let s='';
  s+=P('M-66 -44 L-74 -128 L-18 -78 Z',FOX)+P('M-58 -58 L-64 -110 L-32 -80 Z',CR); // her right ear, straight
  s+=P('M18 -78 L50 -114 L104 -98 L66 -44 Z',FOX)+P('M50 -114 L104 -98 L70 -88 Z',SOCK)+P('M32 -76 L50 -102 L60 -92 L58 -56 Z',CR); // her LEFT ear, crooked tip
  s+=P('M-80 -30 C-84 -88 -30 -96 0 -94 C30 -96 84 -88 80 -30 C76 12 30 30 0 32 C-30 30 -76 12 -80 -30 Z',FOX);
  s+=P('M-76 -6 C-52 4 -24 6 0 -2 C24 6 52 4 76 -6 C64 20 30 32 0 32 C-30 32 -64 20 -76 -6 Z',CR);
  if(o.helmet) s+=P('M-84 -50 C-84 -118 84 -118 84 -50 Q0 -66 -84 -50 Z',o.helmet)+P('M-40 -98 q40 -16 80 0')+P('M-84 -50 Q-90 -10 -60 6');
  s+=E(-32,-40,10,14,K)+HL(-28,-46,4)+E(32,-40,10,14,K)+HL(36,-46,4);
  s+=E(0,-12,12,8,K)+HL(-4,-14,3)+P('M-14 4 Q-7 13 0 4 Q7 13 14 4');
  s+=E(-56,-14,9,6,c.rosa)+E(56,-14,9,6,c.rosa);
  return s;
}
function foxSit(){
  let s='';
  s+=P('M30 80 C120 90 160 30 140 -30 C130 -62 98 -62 96 -40 C110 0 90 50 30 50 Z',FOX);
  s+=P('M140 -30 C130 -62 98 -62 96 -40 C106 -28 122 -22 142 -20 Z',CR);
  s+=P('M-56 96 C-66 30 -40 -20 0 -24 C40 -20 66 30 56 96 Z',FOX);
  s+=P('M-24 -16 C-10 10 10 10 24 -16 C34 30 26 66 0 74 C-26 66 -34 30 -24 -16 Z',CR);
  s+=R(-40,36,26,58,13,FOX)+R(14,36,26,58,13,FOX);
  s+=P('M-41 72 L-13 72 L-13 92 Q-13 106 -27 106 Q-41 106 -41 92 Z',SOCK)+P('M13 72 L41 72 L41 92 Q41 106 27 106 Q13 106 13 92 Z',SOCK);
  s+=G(0,-92,1,foxHead());
  return s;
}
function foot(type){
  if(type==='skate') return P('M-14 -6 L14 -6 L16 16 Q36 18 38 32 L38 38 L-14 38 Z',Wh)+P('M-6 4 l12 0 M-6 14 l14 0')+L(-6,38,-6,48)+L(30,38,30,48)+R(-20,46,64,8,4,c.gris_claro);
  if(type==='blade'){let s=P('M-14 -6 L14 -6 L16 16 Q36 18 38 32 L38 38 L-14 38 Z',c.morado)+P('M-6 4 l12 0 M-6 14 l14 0')+R(-18,38,58,10,4,c.gris);
    [[-10,c.fucsia],[14,c.turquesa],[38,c.verde_lima]].forEach(([x,f])=>{s+=C(x,62,13,f)+C(x,62,4,Wh);
      for(let i=0;i<5;i++){const a=(30+i*30)*Math.PI/180;s+=L(n(x+19*Math.cos(a)),n(62+19*Math.sin(a)),n(x+27*Math.cos(a)),n(62+27*Math.sin(a)),'stroke-width="3"');}});
    return s;}
  return P('M-14 -4 L14 -4 L16 10 Q36 12 36 26 L-14 26 Z',SOCK);
}
function foxStand(o={}){
  const feet=o.feet||'shoe';let s='';

<script>// Juniper's voice: shared by Learning Park and Coloring Park (same origin, localStorage 'juniperVoice').
const JVOICE = (() => {
  const OK = typeof window !== 'undefined' && 'speechSynthesis' in window;
  const KEY = 'juniperVoice';
  const DEF = { en: '', es: '', pitch: 1.3, rate: 1.0 };
  let cfg = Object.assign({}, DEF); try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
  const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const L = v => (v.lang || '').replace('_', '-');
  const NOVELTY = /\b(bubbles|bells|whisper|albert|bad news|good news|zarvox|trinoids|boing|cellos|deranged|hysterical|jester|organ|superstar|wobble|ralph|junior|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley)\b/i;
  const MALE = /\b(fred|daniel|alex|tom|aaron|arthur|gordon|lee|oliver|rishi|evan|nathan|david|mark|guy|james|george|ryan|eric|christopher|roger|steffan|thomas|jorge|diego|juan|carlos|pablo|enrique|raul|alvaro)\b/i;
  const EN_PREF = ['ava', 'zoe', 'samantha', 'allison', 'susan', 'nicky', 'karen'];
  const EN_FEM = /\b(ava|zoe|samantha|allison|susan|nicky|karen|victoria|tessa|moira|fiona|veena|serena|kate|joelle|noelle|aria|jenny|zira|michelle|emma|ana|sonia|libby|google us english|google uk english female)\b/i;
  const ES_PREF = ['paulina', 'monica', 'marisol', 'angelica'];
  const bad = v => NOVELTY.test(v.name) || MALE.test(v.name);
  const quality = v => (/premium/i.test(v.name) ? 40 : /enhanced|natural|neural/i.test(v.name) ? 25 : 0);

async function download(url, name) {
