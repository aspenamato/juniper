.buildpic .ic{width:min(24vmin,200px);height:min(24vmin,200px);display:block}
/* match */
.match{position:relative;display:flex;gap:min(16vw,180px);justify-content:center;align-items:center}
.match .colm{display:flex;flex-direction:column;gap:1.6vmin}
.match .mi{min-width:min(22vmin,190px);min-height:min(13vmin,110px);background:#fff;border:5px solid #ce93d8;border-radius:22px;box-shadow:0 5px 0 #ab47bc;display:flex;align-items:center;justify-content:center;padding:6px 12px;touch-action:none}
.match .mi .ic{width:min(10vmin,86px);height:min(10vmin,86px)}
.match .mi .lt{font-size:clamp(40px,6vmin,60px)}
.match .mi.sel{background:#f3e5f5;transform:scale(1.06)}
.match .mi.done{border-color:var(--mc);box-shadow:0 5px 0 var(--mc);background:#fafafa}
.match svg.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* trace */
.tracewrap{position:relative;width:min(56vmin,480px);height:min(56vmin,480px);background:#e3f2fd;border-radius:30px;border:6px solid #90caf9;overflow:hidden}
.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* sudoku */
.sud{display:grid;grid-template-columns:repeat(4,1fr);border:6px solid #3b2a20;border-radius:14px;overflow:hidden;background:#fff}
.sud .sc{width:min(13vmin,104px);height:min(13vmin,104px);border:2px solid #bca;display:grid;place-items:center;font-size:clamp(36px,6vmin,56px);font-weight:900}
.sud .sc.given{background:#f5ede3}
.sud .sc.sel{background:#fff59d}
.sud .sc.r1{border-bottom:5px solid #3b2a20}.sud .sc.c1{border-right:5px solid #3b2a20}
.sud .sc .ic{width:80%;height:80%}
.sudpal{display:flex;gap:2vmin}
.sudpal .opt{min-width:96px;min-height:96px}
/* deduce */
.ded{display:flex;flex-direction:column;gap:1.6vmin;align-items:center;width:100%}
.dclues{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dclue{background:#f3e5f5;border-radius:16px;padding:8px 14px;font-size:clamp(18px,2.8vmin,26px);font-weight:800;cursor:pointer}
.dclue.lit{background:#fff59d}
.dtargets{display:flex;gap:2vmin;justify-content:center;flex-wrap:wrap}
.dt{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:8px;border:4px solid #e1bee7;min-width:min(19vmin,150px)}
.dt .who{font-weight:900;font-size:clamp(17px,2.6vmin,24px);display:flex;flex-direction:column;align-items:center}
.dt .who .ic{width:min(10vmin,84px);height:min(10vmin,84px)}
.dt .slot{min-width:min(13vmin,100px);min-height:min(13vmin,100px)}
.dt .seatnum{font-size:44px;font-weight:900;color:#8d5524}
.piece .ic{width:min(9vmin,76px);height:min(9vmin,76px)}
/* board */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:min(100%,880px)}
.bcell{position:relative;aspect-ratio:1;border-radius:18px;background:#fff;border:4px solid #b3e5fc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,2.6vmin,26px);cursor:pointer}
.bcell .n{position:absolute;left:6px;top:2px}
.bcell .sp{width:62%;height:62%}.bcell .sp svg{width:100%;height:100%}
.bcell .dl{position:absolute;right:4px;bottom:0;font-size:15px;color:#1565c0}
.bcell.start{background:#e8f5e9;border-color:#66bb6a}.bcell.fin{background:#fff8e1;border-color:#fdd835}
.bcell.lit{background:#fff59d}
.token{position:absolute;width:min(8vmin,72px);height:min(8vmin,72px);z-index:5;transition:left .22s,top .22s;pointer-events:none}
.token svg{width:100%;height:100%}
.boardrow{display:flex;align-items:center;gap:3vmin}
.diebtn{width:min(15vmin,130px);height:min(15vmin,130px)}
.diebtn svg{width:100%;height:100%}
.diebtn.roll{animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.brule{font-size:clamp(17px,2.4vmin,22px);font-weight:700;max-width:520px}
/* number line */
.nline{position:relative;width:100%;max-width:1000px;padding:0 10px}
.nline .ticks{display:grid;grid-template-columns:repeat(21,1fr);border-top:6px solid #3b2a20;margin-top:110px}
.nline .tk{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding-top:0}
.nline .tk:before{content:"";width:4px;height:18px;background:#3b2a20}
.nline .tk b{font-size:clamp(16px,2.6vmin,28px);font-weight:900;margin-top:4px;min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:12px}
.nline .tk.wrong b{background:#ffcdd2}.nline .tk.right b{background:#c8e6c9}
.nline .mk{position:absolute;top:10px;width:min(11vmin,96px);transition:left .25s, top .25s;transform:translateX(-50%)}
.nline .mk svg{width:100%;height:auto}
/* hint */
.hint{position:fixed;left:2vmin;bottom:2vmin;display:none;align-items:flex-end;gap:8px;z-index:20;max-width:min(560px,90vw);animation:slideup .35s}
.hint.on{display:flex}
.hintic{width:150px;height:96px;flex:0 0 auto}.hintic svg{width:100%;height:100%}
.hintbub{background:#fffde7;border:4px solid #fdd835;border-radius:22px;padding:10px 14px;font-size:clamp(18px,2.6vmin,24px);font-weight:800;margin-bottom:40px}
@keyframes slideup{from{transform:translateY(120%)}to{transform:translateY(0)}}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);display:none;align-items:center;justify-content:center;z-index:40}
.overlay.on{display:flex}
.card.introcard,.card.celecard{min-height:0;background:#fff;border-radius:34px;padding:22px 28px;box-shadow:0 10px 0 #e8d3bd;border:0;max-width:min(680px,92vw);max-height:92vh;overflow-y:auto}
.introic{width:min(34vmin,260px);height:min(26vmin,200px)}.introic svg{width:100%;height:100%}
.introtitle{font-size:clamp(30px,5vmin,46px);font-weight:900;color:#e0631a;text-align:center}
.introline{font-size:clamp(20px,3vmin,28px);font-weight:700;text-align:center;font-style:italic}
.celetop{display:flex;align-items:center;gap:20px}
.celefox{width:min(30vmin,230px);height:min(36vmin,280px)}.celefox svg{width:100%;height:100%}
.celefox{animation:cheer .8s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.medalpop{width:min(26vmin,200px);height:min(26vmin,200px);animation:medalin .8s cubic-bezier(.2,1.6,.4,1) both}
.medalpop svg{width:100%;height:100%}
@keyframes medalin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.celetxt{font-size:clamp(28px,4.6vmin,44px);font-weight:900;color:#2e7d32;text-align:center}
.celestars{display:flex;gap:10px}.celestars svg{width:64px;height:64px;animation:medalin .6s both}
.celestars svg:nth-child(2){animation-delay:.15s}.celestars svg:nth-child(3){animation-delay:.3s}
.unlocks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.unl{display:flex;flex-direction:column;align-items:center;background:#fff8e1;border:4px solid #fdd835;border-radius:20px;padding:8px 12px;font-weight:900;font-size:16px;text-align:center;max-width:170px;animation:medalin .7s both .4s}
.unl .ui{width:84px;height:84px}.unl .ui svg{width:100%;height:100%}
.row{display:flex;gap:16px;justify-content:center;margin-top:6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100vw;height:100vh}
.piece.sel{border-color:#f57c00;box-shadow:0 5px 0 #ef6c00;transform:scale(1.08)}
.piece.wrong,.slot.wrong,.bcell.wrong,.sc.wrong,.mi.wrong,.tracewrap.wrong{animation:shake .45s}
.buildpic .ic{display:block;width:min(20vmin,170px);height:min(20vmin,170px)}
.board{position:relative}
.startfox,.homefox{pointer-events:none}.startfox svg,.homefox svg{width:100%;height:100%;display:block}
.playbtn{position:relative;z-index:2}
.slot .ic{width:min(9vmin,76px);height:min(9vmin,76px);display:block}.slot .ic svg{width:100%;height:100%}
.dt .slot{font-weight:900;font-size:clamp(14px,2vmin,18px);flex-direction:column}
.bc .qbox{font-size:clamp(40px,6vmin,64px)}
.celefox{width:min(24vmin,190px);height:min(28vmin,220px)}.medalpop{width:min(22vmin,170px);height:min(22vmin,170px)}
.celestars svg{width:52px;height:52px}
.unl{font-size:14px;max-width:150px;padding:6px 10px}.unl .ui{width:64px;height:64px}
.card.celecard{gap:10px}
@media (orientation:portrait){.card.celecard{max-width:94vw}}
.nline .ticks{grid-template-columns:repeat(21,minmax(0,1fr))}
.nline .tk{min-width:0}.nline .tk b{min-width:0;width:100%;min-height:52px}
@media (orientation:portrait){.nline .tk b{font-size:15px}}
/* ================= v2: game look ================= */
:root{--ol:#3b2147;--gold1:#fff27a;--gold2:#ffb300}
html,body{background:#fff4fb;color:var(--ol)}
/* screen + overlay transitions */
.screen.on{animation:scrIn .42s cubic-bezier(.2,1.25,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.overlay{background:rgba(59,33,71,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.overlay.on .card{animation:cardIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
/* ---- glossy game buttons ---- */
.tb,.playbtn,.tile,.tab,.cl,.card,.opt,.bigbtn,.row button,.starcount,.daily,.friend{position:relative;transition:transform .18s cubic-bezier(.3,1.8,.5,1),box-shadow .15s,filter .15s}
.tb{border-radius:22px;background:linear-gradient(180deg,#fff 0%,#fff 48%,#ffe3f2 100%);box-shadow:inset 0 -5px 0 rgba(155,92,255,.16),0 5px 0 #d7b8ec,0 9px 18px rgba(59,33,71,.18);border:3px solid #fff}
.tb:active,.tile:active,.tab:active,.cl:active,.card:active,.opt:active,.bigbtn:active,.row button:active,.friend:active{transform:translateY(4px) scale(1.05,.9)}
.playbtn:active{transform:translateY(4px) scale(1.06,.9)}
.tb:before,.tile:before,.tab:before,.cl:before,.card:before,.opt:before,.bigbtn:before,.playbtn:before,.starcount:before,.row button:before{content:"";position:absolute;left:10%;right:10%;top:4px;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.playbtn{background:linear-gradient(180deg,#7cf06a,#2fbf5a 55%,#1f9a45);color:#fff;border:4px solid #fff;box-shadow:0 7px 0 #167a37,0 0 0 4px rgba(47,191,90,.25),0 14px 30px rgba(31,154,69,.45);text-shadow:0 3px 0 rgba(0,0,0,.22);animation:btnGlow 1.8s ease-in-out infinite}
.playbtn svg circle{fill:#fff}.playbtn svg path{fill:#2fbf5a;stroke:#fff}
.playbtn.small{padding:6px;border-width:4px}
@keyframes btnGlow{0%,100%{box-shadow:0 7px 0 #167a37,0 0 0 4px rgba(47,191,90,.25),0 14px 30px rgba(31,154,69,.45)}50%{box-shadow:0 7px 0 #167a37,0 0 0 14px rgba(124,240,106,.35),0 14px 40px rgba(31,154,69,.6)}}
.starcount{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#fff;text-shadow:0 2px 0 #c77700,0 0 6px rgba(0,0,0,.15);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),0 5px 0 #d98a00,0 8px 18px rgba(255,160,0,.35);border:3px solid #fff;overflow:hidden}
.starcount svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));animation:starSpin 4s ease-in-out infinite}
.starcount.bump{animation:bump .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes starSpin{0%,80%,100%{transform:rotate(0) scale(1)}88%{transform:rotate(-15deg) scale(1.15)}94%{transform:rotate(12deg) scale(1.1)}}
.hdr,.hello,.title,.introtitle{color:#ff5a1f;text-shadow:0 3px 0 #fff,0 6px 0 rgba(155,92,255,.25);letter-spacing:.5px}
.title{font-size:clamp(44px,8.6vmin,92px);background:linear-gradient(180deg,#ffb02e,#ff5a1f 55%,#ff2f8a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 7px 0 rgba(155,92,255,.35))}
/* home tiles: colorful candy cards */
#home{background:radial-gradient(120% 70% at 50% 0%,#cdeeff 0,#f4e9ff 45%,#fff4fb 70%)}
.tile{color:#fff;border:4px solid rgba(255,255,255,.95);background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 7px 0 var(--sh),0 14px 26px rgba(59,33,71,.18);overflow:hidden}
.tile b{text-shadow:0 3px 0 rgba(0,0,0,.22);font-size:clamp(21px,3.2vmin,32px)}
.tile small{opacity:.95;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.tile .tic{background:radial-gradient(circle at 40% 35%,#fff 0,#fff 55%,rgba(255,255,255,.75) 70%);border-radius:50%;padding:6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.t-path{--c1:#5ef08a;--c2:#18b45a;--sh:#0f8a43;--bd:#fff;animation:tileGlow 2s ease-in-out infinite}
.t-shelf{--c1:#5cc8ff;--c2:#2a7cff;--sh:#1d58c4}.t-troph{--c1:#ffe259;--c2:#ffa400;--sh:#d88400}.t-dress{--c1:#ff8fd0;--c2:#ff3f9b;--sh:#d01f78}.t-color{--c1:#c59bff;--c2:#8a4dff;--sh:#6630d0}
@keyframes tileGlow{0%,100%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 7px 0 #0f8a43,0 0 0 0 rgba(94,240,138,.0),0 14px 26px rgba(59,33,71,.18)}50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 7px 0 #0f8a43,0 0 0 8px rgba(94,240,138,.45),0 14px 30px rgba(24,180,90,.35)}}
.tile:after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));transform:rotate(20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
.t-shelf:after{animation-delay:1s}.t-troph:after{animation-delay:2s}.t-dress:after{animation-delay:3s}.t-color:after{animation-delay:4s}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.tiles .tile{animation:popIn .55s cubic-bezier(.2,1.6,.4,1) both}.tiles .tile:nth-child(2){animation-delay:.06s}.tiles .tile:nth-child(3){animation-delay:.12s}.tiles .tile:nth-child(4){animation-delay:.18s}.tiles .tile:nth-child(5){animation-delay:.24s}
.tiles .t-path{animation:popIn .55s cubic-bezier(.2,1.6,.4,1) both,tileGlow 2s ease-in-out .6s infinite}
@keyframes popIn{0%{transform:scale(.3) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.homefox,.startfox{pointer-events:auto;animation:none;cursor:pointer}
.homefoxwrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.friendsrow{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-end;gap:1.4vmin;padding:0 2vmin 1.6vmin;flex-wrap:nowrap}
.friend{width:min(9.5vmin,96px);height:min(9.5vmin,96px);animation:popIn .5s cubic-bezier(.2,1.6,.4,1) calc(.3s + var(--i) * .07s) both;border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.95),rgba(255,255,255,.5) 60%,rgba(255,255,255,0) 72%)}
.friend svg{width:100%;height:100%}
@media (orientation:portrait){.friendsrow{gap:.6vw;padding:0 1vw 1.4vh}.friend{width:calc((100vw - 14vw) / 11);height:calc((100vw - 14vw) / 11)}}
@media (orientation:landscape){.friend{width:min(8vmin,84px);height:min(8vmin,84px)}}
/* start */
#start{background:radial-gradient(90% 60% at 50% 30%,#fff6c9 0,#ffd6f0 40%,#b9d8ff 75%,#a28cff 100%)}
#start:after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:radial-gradient(120% 100% at 50% 100%,#7be36b 0,#46c35a 60%,#2fa84f 100%);border-radius:50% 50% 0 0/40% 40% 0 0;z-index:0}
.startwrap{position:relative;z-index:1}
.startfriends{display:flex;gap:1.2vmin;align-items:flex-end}
.sf{width:min(9vmin,90px);height:min(9vmin,90px);animation:popIn .55s cubic-bezier(.2,1.6,.4,1) calc(.4s + var(--i) * .1s) both}
.sf svg{width:100%;height:100%}
/* speech bubble that pops over a talking character */
.chatbub{position:fixed;z-index:70;left:0;top:0;background:#fff;color:var(--ol);border:4px solid var(--ol);border-radius:24px;padding:10px 16px;font-weight:900;font-size:clamp(17px,2.4vmin,24px);line-height:1.2;box-shadow:0 6px 0 rgba(59,33,71,.25);pointer-events:none;opacity:0;transform:scale(.4);transform-origin:var(--tx,50%) 100%;transition:opacity .15s,transform .35s cubic-bezier(.2,1.7,.4,1)}
.chatbub.on{opacity:1;transform:scale(1)}
.chatbub.below{transform-origin:var(--tx,50%) 0}
.chatbub:after{content:"";position:absolute;bottom:-17px;left:var(--tx,50%);margin-left:-12px;border:13px solid transparent;border-top-color:var(--ol);border-bottom:0}
.chatbub.below:after{bottom:auto;top:-17px;border-top:0;border-bottom:13px solid var(--ol)}
.chatbub .es{color:#1f9a45}
/* ---- living characters ---- */
.chr .m-open{opacity:0}
.chr.talking .m-open{animation:mOpen .24s steps(1) infinite}.chr.talking .m-closed{animation:mClosed .24s steps(1) infinite}
.chr.talking.mo .m-open{animation:none;opacity:1}.chr.talking.mo .m-closed{animation:none;opacity:0}
@keyframes mOpen{0%{opacity:1}50%{opacity:0}}@keyframes mClosed{0%{opacity:0}50%{opacity:1}}
.alive .chr .ch-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
.alive .chr:nth-child(2n) .ch-eyes,.alive .mchr:nth-child(2n) .ch-eyes,.alive .friend:nth-child(2n) .ch-eyes{animation-delay:-1.7s}
.alive .friend:nth-child(3n) .ch-eyes,.alive .mchr:nth-child(3n) .ch-eyes{animation-delay:-2.9s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.alive .chr .ch-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
.alive .chr .ch-head{transform-box:fill-box;transform-origin:50% 85%;animation:tilt 5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.alive .chr.talking .ch-head{animation:nod .5s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(2px)}}
.alive .chr .ch-tail{transform-box:fill-box;animation:wag 1.3s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.chr-juniper .ch-tail{transform-origin:100% 80%}.chr-mamafox .ch-tail{transform-origin:0% 85%}.chr-scramble .ch-tail{transform-origin:5% 90%}
.chr-marcus .ch-tail,.chr-pearl .ch-tail{transform-origin:100% 50%}.chr-toulouse .ch-tail,.chr-winnie .ch-tail,.chr-teddy .ch-tail{transform-origin:0% 100%}.chr-marengo .ch-tail{transform-origin:100% 0%}
.alive .chr-toulouse .ch-tail,.alive .chr-winnie .ch-tail,.alive .chr-teddy .ch-tail{animation-duration:.55s}
.alive .chr .ch-earL,.alive .chr .ch-earR{transform-box:fill-box;transform-origin:50% 100%;animation:ear 3.6s ease-in-out infinite}
.alive .chr .ch-earR{animation-delay:-1.1s}
@keyframes ear{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-9deg)}95%{transform:rotate(6deg)}}
.alive .chr .ch-mane{transform-box:fill-box;transform-origin:50% 0;animation:mane 2.4s ease-in-out infinite}
@keyframes mane{0%,100%{transform:skewX(0)}50%{transform:skewX(-5deg)}}
.alive .chr .ch-wheel{transform-box:fill-box;transform-origin:50% 50%;animation:spin .8s linear infinite}
.alive .chr .ch-spark,.alive .twk{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.alive .chr-juniper.pose-wave .ch-armR{transform-origin:0 0;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.alive .chr-juniper.pose-cheer .ch-armR{transform-origin:0 0;animation:wave .6s ease-in-out infinite}
.alive .chr-juniper.pose-cheer .ch-armL{transform-origin:0 0;animation:waveL .6s ease-in-out infinite}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.alive .chr-juniper.talking .ch-armR{transform-origin:0 0;animation:wave .5s ease-in-out infinite}

<script>// Juniper's Coloring Park - original line art (vector, drawn for Aspen). Not copied from any app.
const PALETTE = [
  ['rojo','red','#e53935'],['naranja','orange','#f57c00'],['amarillo','yellow','#fdd835'],
  ['verde lima','lime','#c0ca33'],['verde','green','#43a047'],['verde oscuro','dark green','#2e7d32'],
  ['turquesa','turquoise','#26c6da'],['celeste','sky blue','#81d4fa'],['azul','blue','#1e88e5'],
  ['azul marino','navy','#3949ab'],['morado','purple','#8e24aa'],['lila','lilac','#ce93d8'],
  ['rosa','pink','#f48fb1'],['fucsia','magenta','#e91e63'],['melocotón','peach','#ffcc99'],
  ['crema','cream','#fbe7c8'],['canela','tan','#c68642'],['marrón','brown','#8d5524'],
  ['marrón oscuro','dark brown','#5d4037'],['gris claro','light gray','#cfd8dc'],['gris','gray','#90a4ae'],
  ['negro','black','#3d3a45'],['blanco','white','#ffffff']
];
const ART = (() => {
const c = {}; PALETTE.forEach(p => c[p[0].replace(/ /g,'_').replace('ó','o')] = p[2]);
const K = '#222', Wh = c.blanco;
const n = v => Math.round(v*10)/10;
const E=(cx,cy,rx,ry,f=Wh,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${x}/>`;
const C=(cx,cy,r,f=Wh,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${x}/>`;
const P=(d,f='none',x='')=>`<path d="${d}" fill="${f}" ${x}/>`;
const R=(x,y,w,h,r,f=Wh,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${ex}/>`;
const L=(x1,y1,x2,y2,ex='')=>`<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" ${ex}/>`;
const G=(tx,ty,s,inner,rot=0,flip=false)=>`<g transform="translate(${tx} ${ty}) rotate(${rot}) scale(${flip?-s:s} ${s})">${inner}</g>`;
const HL=(cx,cy,r)=>C(cx,cy,r,Wh,'stroke="none"');
let clipN=0;
function scallop(cx,cy,rx,ry,nb,bump=0.18,rot=0){
  const pts=[];for(let i=0;i<nb;i++){const a=rot+i/nb*2*Math.PI;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}
  let d=`M${n(pts[0][0])} ${n(pts[0][1])}`;const k=1+bump*2;
  for(let i=0;i<nb;i++){const a=rot+(i+0.5)/nb*2*Math.PI;const p=pts[(i+1)%nb];
    d+=` Q${n(cx+rx*k*Math.cos(a))} ${n(cy+ry*k*Math.sin(a))} ${n(p[0])} ${n(p[1])}`;}
  return d+'Z';
}
function starD(cx,cy,r1,r2,np=5,rot=-90){let d='';for(let i=0;i<np*2;i++){const r=i%2?r2:r1,a=(rot+i*180/np)*Math.PI/180;
  d+=(i?'L':'M')+n(cx+r*Math.cos(a))+' '+n(cy+r*Math.sin(a))+' ';}return d+'Z';}
const svg=inner=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768"><g stroke="${K}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
// ---------- scenery ----------
const frame=sky=>R(6,6,1012,756,28,sky);
const ground=(y,f,amp=24)=>P(`M6 ${y} Q 256 ${y-amp} 512 ${y} T 1018 ${y} L1018 734 Q1018 762 990 762 L34 762 Q6 762 6 734 Z`,f);
const cloud=(x,y,s=1)=>P(scallop(x,y,70*s,32*s,8,0.22),Wh);
const sun=(x,y,r=46)=>{let s='';for(let i=0;i<10;i++){const a=i*36*Math.PI/180;s+=L(n(x+(r+12)*Math.cos(a)),n(y+(r+12)*Math.sin(a)),n(x+(r+30)*Math.cos(a)),n(y+(r+30)*Math.sin(a)));}
  return s+C(x,y,r,c.amarillo)+E(x-15,y-6,5,7,K,'stroke="none"')+E(x+15,y-6,5,7,K,'stroke="none"')+P(`M${x-16} ${y+12} Q${x} ${y+26} ${x+16} ${y+12}`);};
const tree=(x,y,s=1,leaf=c.verde)=>R(x-14*s,y-90*s,28*s,90*s,8,c.marron)+P(scallop(x,y-150*s,80*s,70*s,9,0.16),leaf)+P(`M${x-30*s} ${y-150*s} q15 -15 30 0`)+P(`M${x+10*s} ${y-180*s} q12 -12 24 0`);
const bush=(x,y,s=1,f=c.verde)=>P(scallop(x,y,60*s,30*s,7,0.2),f);
const flower=(x,y,f=c.rosa,s=1)=>L(x,y,x,y+40*s)+P(`M${x} ${y+30*s} q-18 -14 -24 2 q14 8 24 -2Z`,c.verde)+P(scallop(x,y,16*s,16*s,5,0.35),f)+C(x,y,6*s,c.amarillo);
const grassTufts=(pts)=>pts.map(([x,y])=>P(`M${x-10} ${y} q4 -14 6 -18 M${x} ${y} q0 -16 2 -22 M${x+10} ${y} q-2 -14 -6 -18`)).join('');
const heart=(x,y,s=1,f=c.rojo)=>P(`M${x} ${y+18*s} C${x-40*s} ${y-8*s} ${x-18*s} ${y-34*s} ${x} ${y-14*s} C${x+18*s} ${y-34*s} ${x+40*s} ${y-8*s} ${x} ${y+18*s} Z`,f);
const acorn=(x,y,s=1)=>G(x,y,s,E(0,10,16,20,c.canela)+R(-3,-30,6,14,3,c.marron_oscuro)+P('M-21 2 Q-22 -20 0 -20 Q22 -20 21 2 Z',c.marron)+P('M-12 -4 l6 -8 M0 -4 l6 -8 M10 -2 l5 -7'));
const carnation=(x,y,s=1)=>G(x,y,s,P('M0 18 Q4 40 0 60')+P('M0 40 q-18 -10 -22 4 q14 6 22 -4Z',c.verde)+P(scallop(0,0,22,18,11,0.22),c.verde_lima)+P(scallop(0,-2,12,9,7,0.25),c.verde));
// ---------- characters ----------
const FOX=c.naranja, CR=c.crema, SOCK=c.marron_oscuro;
function foxHead(o={}){
  let s='';
  s+=P('M-66 -44 L-74 -128 L-18 -78 Z',FOX)+P('M-58 -58 L-64 -110 L-32 -80 Z',CR); // her right ear, straight
  s+=P('M18 -78 L50 -114 L104 -98 L66 -44 Z',FOX)+P('M50 -114 L104 -98 L70 -88 Z',SOCK)+P('M32 -76 L50 -102 L60 -92 L58 -56 Z',CR); // her LEFT ear, crooked tip
  s+=P('M-80 -30 C-84 -88 -30 -96 0 -94 C30 -96 84 -88 80 -30 C76 12 30 30 0 32 C-30 30 -76 12 -80 -30 Z',FOX);
  s+=P('M-76 -6 C-52 4 -24 6 0 -2 C24 6 52 4 76 -6 C64 20 30 32 0 32 C-30 32 -64 20 -76 -6 Z',CR);
  if(o.helmet) s+=P('M-84 -50 C-84 -118 84 -118 84 -50 Q0 -66 -84 -50 Z',o.helmet)+P('M-40 -98 q40 -16 80 0')+P('M-84 -50 Q-90 -10 -60 6');
  s+=E(-32,-40,10,14,K)+HL(-28,-46,4)+E(32,-40,10,14,K)+HL(36,-46,4);
  s+=E(0,-12,12,8,K)+HL(-4,-14,3)+P('M-14 4 Q-7 13 0 4 Q7 13 14 4');
  s+=E(-56,-14,9,6,c.rosa)+E(56,-14,9,6,c.rosa);
  return s;
}
function foxSit(){
  let s='';
  s+=P('M30 80 C120 90 160 30 140 -30 C130 -62 98 -62 96 -40 C110 0 90 50 30 50 Z',FOX);
  s+=P('M140 -30 C130 -62 98 -62 96 -40 C106 -28 122 -22 142 -20 Z',CR);
  s+=P('M-56 96 C-66 30 -40 -20 0 -24 C40 -20 66 30 56 96 Z',FOX);
  s+=P('M-24 -16 C-10 10 10 10 24 -16 C34 30 26 66 0 74 C-26 66 -34 30 -24 -16 Z',CR);
  s+=R(-40,36,26,58,13,FOX)+R(14,36,26,58,13,FOX);
  s+=P('M-41 72 L-13 72 L-13 92 Q-13 106 -27 106 Q-41 106 -41 92 Z',SOCK)+P('M13 72 L41 72 L41 92 Q41 106 27 106 Q13 106 13 92 Z',SOCK);
  s+=G(0,-92,1,foxHead());
  return s;
}
function foot(type){
  if(type==='skate') return P('M-14 -6 L14 -6 L16 16 Q36 18 38 32 L38 38 L-14 38 Z',Wh)+P('M-6 4 l12 0 M-6 14 l14 0')+L(-6,38,-6,48)+L(30,38,30,48)+R(-20,46,64,8,4,c.gris_claro);
  if(type==='blade'){let s=P('M-14 -6 L14 -6 L16 16 Q36 18 38 32 L38 38 L-14 38 Z',c.morado)+P('M-6 4 l12 0 M-6 14 l14 0')+R(-18,38,58,10,4,c.gris);
    [[-10,c.fucsia],[14,c.turquesa],[38,c.verde_lima]].forEach(([x,f])=>{s+=C(x,62,13,f)+C(x,62,4,Wh);
      for(let i=0;i<5;i++){const a=(30+i*30)*Math.PI/180;s+=L(n(x+19*Math.cos(a)),n(62+19*Math.sin(a)),n(x+27*Math.cos(a)),n(62+27*Math.sin(a)),'stroke-width="3"');}});
    return s;}
  return P('M-14 -4 L14 -4 L16 10 Q36 12 36 26 L-14 26 Z',SOCK);
}
function foxStand(o={}){
  const feet=o.feet||'shoe';let s='';
  s+=P('M-30 10 C-120 30 -170 -20 -160 -90 C-152 -112 -122 -110 -118 -92 C-116 -46 -84 -24 -30 -24 Z',FOX);
  s+=P('M-160 -90 C-152 -112 -122 -110 -118 -92 C-128 -84 -144 -80 -162 -76 Z',CR);
  s+=R(-36,10,28,82,14,FOX)+R(8,10,28,82,14,FOX);
  s+=G(-22,96,1,foot(feet))+G(22,96,1,foot(feet));
  s+=E(0,-14,52,62,FOX)+E(0,-2,30,44,CR);
  const arm=(side,ang)=>`<g transform="rotate(${ang} ${side*36} -50)">`+R(side>0?36:-104,-62,68,26,13,FOX)+C(side>0?104:-104,-49,15,SOCK)+`</g>`;
  if(o.golf){
    s+=`<g transform="rotate(${o.golf} 0 -30)">`+R(-4,-36,10,150,4,c.gris)+P('M-12 110 L40 110 Q48 110 48 120 L48 128 L-12 128 Z',c.gris_claro)+R(-8,-46,18,40,6,c.negro)+`</g>`;
    s+=arm(-1,-60)+arm(1,240);
  } else s+=arm(-1,o.armL??-25)+arm(1,o.armR??25);
  if(o.scarf) s+=P('M-48 -72 Q0 -50 48 -72 L50 -54 Q0 -30 -50 -54 Z',o.scarf)+R(14,-56,22,56,8,o.scarf)+L(18,-6,18,4)+L(25,-6,25,4)+L(32,-6,32,4);
  s+=G(0,-108,0.92,foxHead({helmet:o.helmet}));
  return s;
}
function tortoise(){
  const id='sh'+(++clipN);let s='';
  const shell='M-120 20 C-120 -80 -70 -110 0 -110 C70 -110 120 -80 120 20 Z';
  s+=R(-100,10,40,60,18,c.verde_lima)+R(60,10,40,60,18,c.verde_lima)+E(-80,68,26,10,c.verde_lima)+E(80,68,26,10,c.verde_lima);
  s+=P('M-120 6 Q-150 0 -160 20 Q-140 26 -118 22 Z',c.verde_lima);
  s+=P('M100 -10 C130 -40 170 -60 205 -40 C240 -20 236 30 200 38 C170 44 130 34 104 22 Z',c.verde_lima);
  s+=E(196,-14,13,17,K)+HL(200,-20,5)+P('M184 18 Q205 30 224 14')+E(178,8,8,5,c.rosa);
  s+=`<clipPath id="${id}"><path d="${shell}"/></clipPath>`+P(shell,c.marron);
  s+=`<g clip-path="url(#${id})">`+P('M-40 -76 L40 -76 L62 -30 L40 14 L-40 14 L-62 -30 Z',c.canela)+
    L(-40,-76,-70,-140)+L(40,-76,70,-140)+L(62,-30,140,-40)+L(-62,-30,-140,-40)+L(40,14,60,40)+L(-40,14,-60,40)+L(0,-76,0,-140)+`</g>`;
  s+=P(shell)+P(scallop(-70,-74,16,10,6,0.3),c.verde)+R(-130,14,260,22,11,c.canela);
  return s;
}
function owl(){
  let s='';
  s+=P('M-70 -100 L-86 -160 L-30 -118 Z',c.marron)+P('M70 -100 L86 -160 L30 -118 Z',c.marron);
  s+=E(0,0,100,124,c.marron)+E(0,36,62,82,c.crema);
  for(const [x,y] of [[-24,0],[24,0],[0,30],[-30,56],[30,56],[0,86]]) s+=P(`M${x-12} ${y} q12 12 24 0`);
  s+=P('M-96 -20 C-140 20 -120 90 -70 110 C-80 60 -76 10 -96 -20 Z',c.marron_oscuro)+P('M96 -20 C140 20 120 90 70 110 C80 60 76 10 96 -20 Z',c.marron_oscuro);
  s+=C(-40,-56,42,c.canela)+C(40,-56,42,c.canela);
  s+=C(-40,-56,25,c.amarillo)+C(-40,-56,12,K)+HL(-35,-61,5)+C(40,-56,25,c.amarillo)+C(40,-56,12,K)+HL(45,-61,5);
  s+=P('M-12 -30 L12 -30 L0 -6 Z',c.naranja);
  s+=G(70,-100,1,carnation(0,0,1),20);
  s+=P('M-40 118 l-10 18 M-30 120 l0 20 M-20 118 l10 18 M20 118 l-10 18 M30 120 l0 20 M40 118 l10 18');
  return s;
}
function squirrel(){
  let s='';
  s+=P('M-10 70 C-120 70 -130 -20 -100 -90 C-80 -140 -10 -150 0 -110 C-60 -110 -80 -50 -60 -10 C-40 30 -20 40 -10 40 Z',c.gris);
  s+=P('M-70 -60 q20 -10 30 10 M-90 0 q20 -6 30 14',);
  s+=E(30,30,50,60,c.gris)+E(42,44,28,40,c.crema);

<script>// Juniper's voice: shared by Learning Park and Coloring Park (same origin, localStorage 'juniperVoice').
const JVOICE = (() => {
  const OK = typeof window !== 'undefined' && 'speechSynthesis' in window;

  let cfg = Object.assign({}, DEF); try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
  const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  const NOVELTY = /\b(bubbles|bells|whisper|albert|bad news|good news|zarvox|trinoids|boing|cellos|deranged|hysterical|jester|organ|superstar|wobble|ralph|junior|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley)\b/i;
  const MALE = /\b(fred|daniel|alex|tom|aaron|arthur|gordon|lee|oliver|rishi|evan|nathan|david|mark|guy|james|george|ryan|eric|christopher|roger|steffan|thomas|jorge|diego|juan|carlos|pablo|enrique|raul|alvaro)\b/i;
  const EN_PREF = ['ava', 'zoe', 'samantha', 'allison', 'susan', 'nicky', 'karen'];
  const EN_FEM = /\b(ava|zoe|samantha|allison|susan|nicky|karen|victoria|tessa|moira|fiona|veena|serena|kate|joelle|noelle|aria|jenny|zira|michelle|emma|ana|sonia|libby|google us english|google uk english female)\b/i;
  const ES_PREF = ['paulina', 'monica', 'marisol', 'angelica'];
  const bad = v => NOVELTY.test(v.name) || MALE.test(v.name);
  const quality = v => (/premium/i.test(v.name) ? 40 : /enhanced|natural|neural/i.test(v.name) ? 25 : 0);
  function score(v, pref, femRe, lang0) { const n = fold(v.name); if (bad(v)) return -1; let s = 0;
    const i = pref.findIndex(p => new RegExp('\\b' + p + '\\b').test(n)); if (i >= 0) s += 100 - i * 8; else if (femRe && femRe.test(v.name)) s += 40;
    s += quality(v); if (L(v) === lang0) s += 6; if (v.localService) s += 2; return s; }

  const byName = (list, n) => n ? list.find(v => v.name === n) || null : null;

  // ---------- grown-up panel ----------
  const CSS = `#jvPanel{position:fixed;inset:0;z-index:200;background:rgba(40,30,20,.5);display:none;align-items:center;justify-content:center;font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;color:#3b2a20}
