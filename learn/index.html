<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Juniper Learn">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#fff7ec">
<title>Juniper's Learning Park</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff7ec;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Avenir Next",system-ui,sans-serif;color:#3b2a20;touch-action:manipulation}
button,a.tile{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-decoration:none}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
/* start */
#start{background:linear-gradient(#bfe7ff,#e9f7ff 55%,#c5e8a5 55%,#a5d77f)}
.startwrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:2vmin}
.title{font-size:clamp(40px,8vmin,84px);font-weight:900;text-align:center;line-height:1;color:#e0631a;text-shadow:0 4px 0 #fff,0 7px 0 rgba(0,0,0,.08)}
.startfox{width:min(46vmin,420px);height:min(46vmin,420px);animation:bob 2.4s ease-in-out infinite}
.playbtn{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:10px 34px 10px 12px;box-shadow:0 6px 0 #2e7d32,0 10px 24px rgba(0,0,0,.18);font-size:clamp(30px,5vmin,48px);font-weight:900;color:#2e7d32}
.playbtn svg{width:clamp(70px,11vmin,110px);height:clamp(70px,11vmin,110px)}
.playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e7d32}
.playbtn.small{padding:8px;box-shadow:0 5px 0 #2e7d32}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
/* top bars */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:84px}
.tb{width:68px;height:68px;border-radius:20px;background:#fff;box-shadow:0 4px 0 #e8d3bd,0 6px 14px rgba(120,70,20,.12);display:grid;place-items:center;flex:0 0 auto}
.tb svg{width:42px;height:42px}
.tb:active,.bigbtn:active,.tile:active,.opt:active{transform:scale(.94)}
.starcount{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;font-weight:900;font-size:30px;box-shadow:0 4px 0 #e8d3bd}
.starcount svg{width:44px;height:44px}
.hdr,.hello{font-size:clamp(24px,4vmin,38px);font-weight:900;color:#e0631a}
.hello{flex:1;text-align:center}
/* home */
#home{background:linear-gradient(#d9f1ff,#fff7ec 40%)}
.homegrid{flex:1;display:flex;align-items:center;justify-content:center;gap:3vmin;padding:2vmin 3vmin;min-height:0}
.homefox{flex:0 0 auto;width:min(36vw,46vh);height:min(48vh,60vw);animation:bob 3s ease-in-out infinite}
.homefox svg{width:100%;height:100%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.2vmin;width:min(60vw,720px)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;border-radius:28px;padding:14px 10px;min-height:150px;box-shadow:0 6px 0 var(--sh,#e8d3bd),0 10px 22px rgba(0,0,0,.08);border:4px solid var(--bd,#fff)}
.tile b{font-size:clamp(20px,3vmin,30px);font-weight:900}
.tile small{font-size:15px;opacity:.75;margin-top:2px}
.tic{width:84px;height:84px;display:block}.tic svg{width:100%;height:100%}
.t-path{--bd:#43a047;--sh:#2e7d32;grid-column:1/-1;flex-direction:row;gap:20px;min-height:170px}
.t-path .tic{width:120px;height:120px}
.t-shelf{--bd:#1e88e5;--sh:#1565c0}.t-troph{--bd:#fdd835;--sh:#f9a825}.t-dress{--bd:#f48fb1;--sh:#e91e63}.t-color{--bd:#ff9800;--sh:#e65100}
@media (orientation:portrait){.homegrid{flex-direction:column}.homefox{width:38vh;height:30vh}.tiles{width:92vw}}
/* map */
#map{background:#a5d77f}
.mapscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mapSvg svg{width:100%;height:auto;max-width:900px;margin:0 auto}
.node{cursor:pointer}
.node.cur .pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.marker{animation:bob 1.6s ease-in-out infinite}
.daily{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:20px;box-shadow:0 4px 0 #2e7d32}
.daily i{width:24px;height:24px;border-radius:50%;border:3px solid #43a047;display:inline-block}
.daily i.on{background:#fdd835;border-color:#f9a825}
/* shelves */
#shelves{background:#fff7ec}
.tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:center}
.tab{display:flex;align-items:center;gap:6px;background:#fff;border-radius:18px;padding:8px 14px;font-weight:900;font-size:19px;box-shadow:0 4px 0 #e8d3bd;border:3px solid transparent}
.tab svg{width:34px;height:34px}
.tab.sel{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.shelfgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:10px 18px 30px;align-content:start;touch-action:pan-y}
.card{position:relative;background:#fff;border-radius:24px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--c,#e8d3bd),0 8px 18px rgba(0,0,0,.07);border:3px solid var(--c,#eee);min-height:190px}
.card .cic{width:96px;height:96px}.card .cic svg{width:100%;height:100%}
.card b{font-size:18px;text-align:center;line-height:1.15}
.card .md{position:absolute;top:6px;right:6px;width:46px;height:46px}
/* trophies */
.trophyroom{flex:1;overflow-y:auto;padding:0 18px 30px;touch-action:pan-y}
.tsection{background:#fff;border-radius:26px;padding:12px 16px 18px;margin:0 0 16px;box-shadow:0 5px 0 #e8d3bd}
.tsection h3{margin:4px 0 10px;font-size:24px;color:#e0631a}
.trgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.troph{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-weight:800;font-size:15px}
.troph .ti{width:104px;height:104px}.troph.locked .ti{filter:grayscale(1) opacity(.35)}
.troph small{font-weight:600;opacity:.7;font-size:13px}
.medalrow{display:flex;gap:24px;flex-wrap:wrap;font-size:30px;font-weight:900;align-items:center}
.medalrow span{display:flex;align-items:center;gap:6px}.medalrow svg{width:64px;height:64px}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.stk{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;text-align:center}
.stk .si{width:86px;height:86px}.stk .si svg{width:100%;height:100%}
.stk.locked .si{filter:grayscale(1) opacity(.25)}
/* dress */
#dress{background:linear-gradient(#ffe3ef,#fff7ec 60%)}
.dresswrap{flex:1;display:flex;gap:2vmin;padding:1vmin 3vmin 3vmin;min-height:0}
.dressfox{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.dressfox svg{height:100%;max-height:72vh;width:auto;max-width:100%}
.closet{flex:1.1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start;touch-action:pan-y}
.cl{background:#fff;border-radius:22px;padding:8px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:15px;text-align:center;box-shadow:0 4px 0 #f0b6cf;border:4px solid transparent;min-height:150px}
.cl .cli{width:96px;height:96px}.cl .cli svg{width:100%;height:100%}
.cl.on{border-color:#e91e63;background:#fff0f6}
.cl.locked{opacity:.55}
.cl .need{display:flex;align-items:center;gap:2px;font-size:16px}.cl .need svg{width:22px;height:22px}
@media (orientation:portrait){.dresswrap{flex-direction:column}.dressfox svg{max-height:42vh}}
/* play */
#play{background:linear-gradient(#e6f6ff,#fff7ec 30%)}
.prog{flex:1;display:flex;gap:8px;justify-content:center;align-items:center}
.prog i{width:42px;height:42px;display:block}
.prog i svg{width:100%;height:100%}
.playmain{flex:1;display:flex;min-height:0;gap:1vmin;padding:0 2vmin 2vmin}
.guide{flex:0 0 22%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding-top:1vmin;min-width:0}
.guidefox{width:100%;max-width:220px;height:30vh}.guidefox svg{width:100%;height:100%}
.guidefox.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px) rotate(-4deg)}}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 14px;font-size:clamp(17px,2.4vmin,24px);font-weight:700;line-height:1.25;box-shadow:0 4px 0 #e8d3bd;max-width:100%}
.bubble:before{content:"";position:absolute;top:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-bottom-color:#fff;border-top:0}
.bubble .es,.es{color:#2e7d32;font-weight:900}
.stage{flex:1;min-width:0;background:#fff;border-radius:30px;box-shadow:0 6px 0 #e8d3bd,0 10px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:2vmin;overflow:hidden;position:relative}
@media (orientation:portrait){.playmain{flex-direction:column}.guide{flex:0 0 auto;flex-direction:row;align-items:center}.guidefox{width:22vw;height:15vh;flex:0 0 auto}.bubble:before{top:50%;left:-14px;margin:-12px 0 0;border:12px solid transparent;border-right-color:#fff;border-left:0}}
.prompt{display:flex;flex-direction:column;align-items:center;gap:1.4vmin;max-width:100%;max-height:58%;overflow:visible}
.opts{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;max-width:100%}
.opt{min-width:120px;min-height:110px;padding:10px 18px;background:#fff;border-radius:26px;border:5px solid #ffcc80;box-shadow:0 6px 0 #ffb74d;display:flex;align-items:center;justify-content:center;transition:transform .1s,opacity .3s}
.opt.right{border-color:#43a047;box-shadow:0 6px 0 #2e7d32;background:#e8f5e9;animation:pop .4s}
.opt.wrong{animation:shake .45s;border-color:#ef9a9a;box-shadow:0 6px 0 #e57373}
.opt.dim{opacity:.35}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.opt .ic{width:100px;height:100px}
.num{font-size:clamp(40px,7vmin,64px);font-weight:900;line-height:1}
.num.sign{font-size:clamp(50px,9vmin,80px)}
.wd{font-size:clamp(28px,4.6vmin,46px);font-weight:900;font-family:"Avenir Next","Century Gothic",ui-rounded,system-ui,sans-serif;letter-spacing:.5px}
.lt{font-size:clamp(50px,8vmin,80px);font-weight:900;font-family:"Avenir Next","Century Gothic",ui-rounded,system-ui,sans-serif;line-height:1}
.yn{font-size:clamp(32px,5vmin,48px);font-weight:900;padding:0 10px}.yn.yes{color:#2e7d32}.yn.no{color:#c62828}
.opts.col{flex-direction:column;align-items:stretch;width:min(560px,92%)}.opts.col .opt{min-height:84px}
.opts.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:min(760px,96%)}
.opts.grid4 .opt .ic{width:min(15vmin,130px);height:min(15vmin,130px)}
.opts.bubbles .opt{border-radius:50%;width:min(19vmin,170px);height:min(19vmin,170px);min-width:0;border-color:#81d4fa;box-shadow:0 6px 0 #4fc3f7;background:radial-gradient(circle at 30% 30%,#fff 0 18%,#e1f5fe 40%,#b3e5fc);animation:float 3s ease-in-out infinite}
.opts.bubbles .opt:nth-child(2){animation-delay:-.8s}.opts.bubbles .opt:nth-child(3){animation-delay:-1.6s}.opts.bubbles .opt:nth-child(4){animation-delay:-2.2s}
.opts.bubbles .opt.right{animation:popgone .5s forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes popgone{0%{transform:scale(1)}60%{transform:scale(1.3)}100%{transform:scale(1.3);opacity:0}}
.opts.wheels .opt{border-radius:50%;width:min(16vmin,140px);height:min(16vmin,140px);min-width:0;border:8px solid #444;box-shadow:0 0 0 6px var(--g,#e91e63),0 0 26px 8px var(--g,#e91e63);background:#fff}
.opts.wheels .opt:nth-child(3n+2){--g:#26c6da}.opts.wheels .opt:nth-child(3n){--g:#c0ca33}
.opts.yn .opt{min-width:180px}
.bigtxt{font-size:clamp(44px,8vmin,80px);font-weight:900;display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center;text-align:center;line-height:1.1}
.qbox{display:inline-flex;align-items:center;justify-content:center;min-width:1.3em;height:1.3em;border:5px dashed #f57c00;border-radius:16px;color:#f57c00;padding:0 .1em;background:#fff8e1}
.icrow{display:flex;flex-wrap:wrap;gap:1vmin;justify-content:center;max-width:min(760px,100%)}
.icrow .ic{width:min(10vmin,92px);height:min(10vmin,92px);position:relative}
.icrow.small .ic{width:min(7vmin,64px);height:min(7vmin,64px)}
.icrow.tiny .ic{width:min(4.4vmin,40px);height:min(4.4vmin,40px)}
.icrow.line .ic{width:min(6vmin,54px);height:min(6vmin,54px)}
.icrow.pat .ic{width:min(9vmin,84px);height:min(9vmin,84px)}
.icrow.coins .ic{width:min(13vmin,120px);height:min(13vmin,120px)}
.ic svg{width:100%;height:100%}
.ic.gone{opacity:.35}.ic.gone:after{content:"";position:absolute;left:8%;right:8%;top:50%;height:7px;background:#e53935;border-radius:4px;transform:rotate(-35deg)}
.cnt .ic{cursor:pointer}
.ic .badge{position:absolute;right:-6px;top:-6px;background:#1e88e5;color:#fff;border-radius:50%;min-width:30px;height:30px;font-weight:900;font-size:18px;display:grid;place-items:center;border:3px solid #fff}
.ic.counted svg{filter:drop-shadow(0 0 6px #fdd835)}
.groups{display:flex;align-items:center;gap:2vmin;flex-wrap:wrap;justify-content:center}
.groups .op{font-size:clamp(40px,7vmin,70px);font-weight:900}
.groups .grp{border:4px dashed #ffcc80;border-radius:22px;padding:8px}
.die{width:min(14vmin,120px)!important;height:min(14vmin,120px)!important;display:block}
.bigic .ic{width:min(28vmin,240px);height:min(28vmin,240px);display:block}
.sent{font-size:clamp(28px,4.8vmin,48px);font-weight:900;text-align:center;line-height:1.35;font-family:"Avenir Next","Century Gothic",ui-rounded,system-ui,sans-serif}
.w{cursor:pointer;border-radius:10px;padding:0 3px}.w.lit{background:#fff59d}
.specpic{display:flex;gap:3vmin;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.specpic .grp{display:flex;gap:6px}.specpic .ic{width:min(14vmin,120px);height:min(14vmin,120px);display:block}
.specpic .on{display:flex;flex-direction:column;align-items:center}.specpic .on .top{margin-bottom:-3vmin;z-index:1;width:min(11vmin,96px);height:min(11vmin,96px)}
.family{display:flex;gap:3vmin}.family .num{background:#fff3e0;border:5px solid #ffb74d;border-radius:50%;width:1.8em;height:1.8em;display:grid;place-items:center}
.clockwrap svg{width:min(34vmin,280px);height:min(34vmin,280px)}
.rods{max-height:30vh}
.wp .sent{font-size:clamp(22px,3.6vmin,36px)}
.cmpgrid{display:flex;flex-direction:column;gap:8px}.cmpgrid>div{display:flex;align-items:center;gap:10px}.cmpgrid b{min-width:120px;font-size:24px}
.cmpgrid .icrow{justify-content:flex-start}
.piles{display:flex;gap:3vmin;align-items:flex-end}.pile{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:140px}.pile b{font-size:34px}
.pile .icrow{flex-wrap:wrap-reverse;max-width:130px}
.clues{display:flex;flex-direction:column;gap:10px;align-items:center}.clue{font-size:clamp(22px,3.4vmin,32px);font-weight:800;background:#f3e5f5;border-radius:18px;padding:8px 16px}
.qtext{font-size:clamp(24px,3.8vmin,38px);font-weight:900;color:#6a1b9a;text-align:center}
.qtext .sent{font-size:inherit;color:inherit}
.mini .icrow{max-width:150px}
.rinksign{font-size:clamp(40px,7vmin,70px);font-weight:900;background:#e1f5fe;border:6px solid #0288d1;border-radius:22px;padding:12px 30px;color:#01579b;font-family:"Avenir Next","Century Gothic",ui-rounded,system-ui,sans-serif}
.nm{font-size:22px;font-weight:900}
.ic.small{width:60px;height:60px}
/* passage */
.withpass{flex-direction:row;align-items:stretch}
.passage{flex:1.2;overflow-y:auto;background:#fffdf5;border:4px solid #ffe082;border-radius:22px;padding:12px 16px;font-size:clamp(19px,2.8vmin,28px);font-weight:700;line-height:1.45;touch-action:pan-y}
.passage h4{margin:0 0 6px;color:#e0631a;font-size:1.1em}
.passage p{margin:4px 0;padding:2px 8px;border-radius:12px;cursor:pointer;font-family:"Avenir Next","Century Gothic",ui-rounded,system-ui,sans-serif}
.passage p.ev{background:#fff59d;box-shadow:0 0 0 3px #fdd835}
.passage p.lit{background:#e1f5fe}
.qside{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin}
@media (orientation:portrait){.withpass{flex-direction:column}.passage{flex:1}}
.readbox{width:100%;max-width:820px;flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.readbox .passage{flex:1}
.rowbtns{display:flex;gap:16px;justify-content:center}
.bigbtn{width:96px;height:96px;border-radius:28px;background:#fff;box-shadow:0 5px 0 #e8d3bd,0 8px 18px rgba(0,0,0,.1);display:grid;place-items:center}
.bigbtn svg{width:60px;height:60px}
.bigbtn.go{background:#e8f5e9;box-shadow:0 5px 0 #2e7d32}
/* drag pieces */
.piece{touch-action:none;cursor:grab;background:#fff;border-radius:20px;border:4px solid #90caf9;box-shadow:0 5px 0 #64b5f6;display:flex;align-items:center;justify-content:center;min-width:86px;min-height:86px;padding:6px 10px}
.piece.dragging{position:fixed;z-index:50;pointer-events:none;transform:scale(1.12);box-shadow:0 14px 26px rgba(0,0,0,.25)}
.piece.ghost{visibility:hidden}
.piece.back{transition:transform .3s}
.tray{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center;min-height:100px}
.slots{display:flex;gap:1.4vmin;justify-content:center;flex-wrap:wrap}
.slot{min-width:96px;min-height:96px;border:5px dashed #ffb74d;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#fff8e1;padding:4px 8px}
.slot.filled{border-style:solid;border-color:#43a047;background:#e8f5e9}
.slot.hot{background:#ffe0b2}
/* ten frame */
.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:6px solid #3b2a20;border-radius:12px;background:#fff}
.tenframe .tf{width:min(13vmin,110px);height:min(13vmin,110px);border:3px solid #3b2a20;display:grid;place-items:center}
.tenframe .tf .ic{width:80%;height:80%}
.ball{width:min(11vmin,90px);height:min(11vmin,90px);touch-action:none;cursor:grab}
.ball.dragging{position:fixed;z-index:50;pointer-events:none}
/* bond */
.bond{position:relative;width:min(60vmin,460px);height:min(44vmin,340px)}
.bond svg.lines{position:absolute;inset:0;width:100%;height:100%}
.bc{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;border:6px solid #3b2a20;background:#fff3e0;display:grid;place-items:center;transform:translate(-50%,-50%)}
.bc.miss{border-style:dashed;border-color:#f57c00;background:#fff8e1}
.bc.miss.hot{background:#ffe0b2}
/* build */
.buildpic .ic{width:min(24vmin,200px);height:min(24vmin,200px);display:block}
/* match */
.match{position:relative;display:flex;gap:min(16vw,180px);justify-content:center;align-items:center}
.match .colm{display:flex;flex-direction:column;gap:1.6vmin}
.match .mi{min-width:min(22vmin,190px);min-height:min(13vmin,110px);background:#fff;border:5px solid #ce93d8;border-radius:22px;box-shadow:0 5px 0 #ab47bc;display:flex;align-items:center;justify-content:center;padding:6px 12px;touch-action:none}
.match .mi .ic{width:min(10vmin,86px);height:min(10vmin,86px)}
.match .mi .lt{font-size:clamp(40px,6vmin,60px)}
.match .mi.sel{background:#f3e5f5;transform:scale(1.06)}
.match .mi.done{border-color:var(--mc);box-shadow:0 5px 0 var(--mc);background:#fafafa}
.match svg.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* trace */
.tracewrap{position:relative;width:min(56vmin,480px);height:min(56vmin,480px);background:#e3f2fd;border-radius:30px;border:6px solid #90caf9;overflow:hidden}
.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* sudoku */
.sud{display:grid;grid-template-columns:repeat(4,1fr);border:6px solid #3b2a20;border-radius:14px;overflow:hidden;background:#fff}
.sud .sc{width:min(13vmin,104px);height:min(13vmin,104px);border:2px solid #bca;display:grid;place-items:center;font-size:clamp(36px,6vmin,56px);font-weight:900}
.sud .sc.given{background:#f5ede3}
.sud .sc.sel{background:#fff59d}
.sud .sc.r1{border-bottom:5px solid #3b2a20}.sud .sc.c1{border-right:5px solid #3b2a20}
.sud .sc .ic{width:80%;height:80%}
.sudpal{display:flex;gap:2vmin}
.sudpal .opt{min-width:96px;min-height:96px}
/* deduce */
.ded{display:flex;flex-direction:column;gap:1.6vmin;align-items:center;width:100%}
.dclues{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dclue{background:#f3e5f5;border-radius:16px;padding:8px 14px;font-size:clamp(18px,2.8vmin,26px);font-weight:800;cursor:pointer}
.dclue.lit{background:#fff59d}
.dtargets{display:flex;gap:2vmin;justify-content:center;flex-wrap:wrap}
.dt{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:22px;padding:8px;border:4px solid #e1bee7;min-width:min(19vmin,150px)}
.dt .who{font-weight:900;font-size:clamp(17px,2.6vmin,24px);display:flex;flex-direction:column;align-items:center}
.dt .who .ic{width:min(10vmin,84px);height:min(10vmin,84px)}
.dt .slot{min-width:min(13vmin,100px);min-height:min(13vmin,100px)}
.dt .seatnum{font-size:44px;font-weight:900;color:#8d5524}
.piece .ic{width:min(9vmin,76px);height:min(9vmin,76px)}
/* board */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:min(100%,880px)}
.bcell{position:relative;aspect-ratio:1;border-radius:18px;background:#fff;border:4px solid #b3e5fc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,2.6vmin,26px);cursor:pointer}
.bcell .n{position:absolute;left:6px;top:2px}
.bcell .sp{width:62%;height:62%}.bcell .sp svg{width:100%;height:100%}
.bcell .dl{position:absolute;right:4px;bottom:0;font-size:15px;color:#1565c0}
.bcell.start{background:#e8f5e9;border-color:#66bb6a}.bcell.fin{background:#fff8e1;border-color:#fdd835}
.bcell.lit{background:#fff59d}
.token{position:absolute;width:min(8vmin,72px);height:min(8vmin,72px);z-index:5;transition:left .22s,top .22s;pointer-events:none}
.token svg{width:100%;height:100%}
.boardrow{display:flex;align-items:center;gap:3vmin}
.diebtn{width:min(15vmin,130px);height:min(15vmin,130px)}
.diebtn svg{width:100%;height:100%}
.diebtn.roll{animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.brule{font-size:clamp(17px,2.4vmin,22px);font-weight:700;max-width:520px}
/* number line */
.nline{position:relative;width:100%;max-width:1000px;padding:0 10px}
.nline .ticks{display:grid;grid-template-columns:repeat(21,1fr);border-top:6px solid #3b2a20;margin-top:110px}
.nline .tk{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding-top:0}
.nline .tk:before{content:"";width:4px;height:18px;background:#3b2a20}
.nline .tk b{font-size:clamp(16px,2.6vmin,28px);font-weight:900;margin-top:4px;min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:12px}
.nline .tk.wrong b{background:#ffcdd2}.nline .tk.right b{background:#c8e6c9}
.nline .mk{position:absolute;top:10px;width:min(11vmin,96px);transition:left .25s, top .25s;transform:translateX(-50%)}
.nline .mk svg{width:100%;height:auto}
/* hint */
.hint{position:fixed;left:2vmin;bottom:2vmin;display:none;align-items:flex-end;gap:8px;z-index:20;max-width:min(560px,90vw);animation:slideup .35s}
.hint.on{display:flex}
.hintic{width:150px;height:96px;flex:0 0 auto}.hintic svg{width:100%;height:100%}
.hintbub{background:#fffde7;border:4px solid #fdd835;border-radius:22px;padding:10px 14px;font-size:clamp(18px,2.6vmin,24px);font-weight:800;margin-bottom:40px}
@keyframes slideup{from{transform:translateY(120%)}to{transform:translateY(0)}}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);display:none;align-items:center;justify-content:center;z-index:40}
.overlay.on{display:flex}
.card.introcard,.card.celecard{min-height:0;background:#fff;border-radius:34px;padding:22px 28px;box-shadow:0 10px 0 #e8d3bd;border:0;max-width:min(680px,92vw);max-height:92vh;overflow-y:auto}
.introic{width:min(34vmin,260px);height:min(26vmin,200px)}.introic svg{width:100%;height:100%}
.introtitle{font-size:clamp(30px,5vmin,46px);font-weight:900;color:#e0631a;text-align:center}
.introline{font-size:clamp(20px,3vmin,28px);font-weight:700;text-align:center;font-style:italic}
.celetop{display:flex;align-items:center;gap:20px}
.celefox{width:min(30vmin,230px);height:min(36vmin,280px)}.celefox svg{width:100%;height:100%}
.celefox{animation:cheer .8s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.medalpop{width:min(26vmin,200px);height:min(26vmin,200px);animation:medalin .8s cubic-bezier(.2,1.6,.4,1) both}
.medalpop svg{width:100%;height:100%}
@keyframes medalin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.celetxt{font-size:clamp(28px,4.6vmin,44px);font-weight:900;color:#2e7d32;text-align:center}
.celestars{display:flex;gap:10px}.celestars svg{width:64px;height:64px;animation:medalin .6s both}
.celestars svg:nth-child(2){animation-delay:.15s}.celestars svg:nth-child(3){animation-delay:.3s}
.unlocks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.unl{display:flex;flex-direction:column;align-items:center;background:#fff8e1;border:4px solid #fdd835;border-radius:20px;padding:8px 12px;font-weight:900;font-size:16px;text-align:center;max-width:170px;animation:medalin .7s both .4s}
.unl .ui{width:84px;height:84px}.unl .ui svg{width:100%;height:100%}
.row{display:flex;gap:16px;justify-content:center;margin-top:6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100vw;height:100vh}
.piece.sel{border-color:#f57c00;box-shadow:0 5px 0 #ef6c00;transform:scale(1.08)}
.piece.wrong,.slot.wrong,.bcell.wrong,.sc.wrong,.mi.wrong,.tracewrap.wrong{animation:shake .45s}
.buildpic .ic{display:block;width:min(20vmin,170px);height:min(20vmin,170px)}
.board{position:relative}
.startfox,.homefox{pointer-events:none}.startfox svg,.homefox svg{width:100%;height:100%;display:block}
.playbtn{position:relative;z-index:2}
.slot .ic{width:min(9vmin,76px);height:min(9vmin,76px);display:block}.slot .ic svg{width:100%;height:100%}
.dt .slot{font-weight:900;font-size:clamp(14px,2vmin,18px);flex-direction:column}
.bc .qbox{font-size:clamp(40px,6vmin,64px)}
.celefox{width:min(24vmin,190px);height:min(28vmin,220px)}.medalpop{width:min(22vmin,170px);height:min(22vmin,170px)}
.celestars svg{width:52px;height:52px}
.unl{font-size:14px;max-width:150px;padding:6px 10px}.unl .ui{width:64px;height:64px}
.card.celecard{gap:10px}
@media (orientation:portrait){.card.celecard{max-width:94vw}}
.nline .ticks{grid-template-columns:repeat(21,minmax(0,1fr))}
.nline .tk{min-width:0}.nline .tk b{min-width:0;width:100%;min-height:52px}
@media (orientation:portrait){.nline .tk b{font-size:15px}}
</style></head>

  <div class="startwrap">

    <button id="playBtn" class="playbtn" aria-label="Play"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#43a047" stroke="#222" stroke-width="5"/><path d="M40 28 L74 50 L40 72 Z" fill="#fff" stroke="#222" stroke-width="5" stroke-linejoin="round"/></svg><span>Play</span></button>

<script>// Juniper's Coloring Park - original line art (vector, drawn for Aspen). Not copied from any app.
const PALETTE = [
  ['rojo','red','#e53935'],['naranja','orange','#f57c00'],['amarillo','yellow','#fdd835'],
  ['verde lima','lime','#c0ca33'],['verde','green','#43a047'],['verde oscuro','dark green','#2e7d32'],
  ['turquesa','turquoise','#26c6da'],['celeste','sky blue','#81d4fa'],['azul','blue','#1e88e5'],
  ['azul marino','navy','#3949ab'],['morado','purple','#8e24aa'],['lila','lilac','#ce93d8'],
  ['rosa','pink','#f48fb1'],['fucsia','magenta','#e91e63'],['melocotón','peach','#ffcc99'],
  ['crema','cream','#fbe7c8'],['canela','tan','#c68642'],['marrón','brown','#8d5524'],
  ['marrón oscuro','dark brown','#5d4037'],['gris claro','light gray','#cfd8dc'],['gris','gray','#90a4ae'],
  ['negro','black','#3d3a45'],['blanco','white','#ffffff']
];
const ART = (() => {
const c = {}; PALETTE.forEach(p => c[p[0].replace(/ /g,'_').replace('ó','o')] = p[2]);
const K = '#222', Wh = c.blanco;
const n = v => Math.round(v*10)/10;
const E=(cx,cy,rx,ry,f=Wh,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${x}/>`;
const C=(cx,cy,r,f=Wh,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${x}/>`;
const P=(d,f='none',x='')=>`<path d="${d}" fill="${f}" ${x}/>`;
const R=(x,y,w,h,r,f=Wh,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${ex}/>`;
const L=(x1,y1,x2,y2,ex='')=>`<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" ${ex}/>`;
const G=(tx,ty,s,inner,rot=0,flip=false)=>`<g transform="translate(${tx} ${ty}) rotate(${rot}) scale(${flip?-s:s} ${s})">${inner}</g>`;
const HL=(cx,cy,r)=>C(cx,cy,r,Wh,'stroke="none"');
let clipN=0;
function scallop(cx,cy,rx,ry,nb,bump=0.18,rot=0){
  const pts=[];for(let i=0;i<nb;i++){const a=rot+i/nb*2*Math.PI;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}
  let d=`M${n(pts[0][0])} ${n(pts[0][1])}`;const k=1+bump*2;
  for(let i=0;i<nb;i++){const a=rot+(i+0.5)/nb*2*Math.PI;const p=pts[(i+1)%nb];
    d+=` Q${n(cx+rx*k*Math.cos(a))} ${n(cy+ry*k*Math.sin(a))} ${n(p[0])} ${n(p[1])}`;}
  return d+'Z';
}
function starD(cx,cy,r1,r2,np=5,rot=-90){let d='';for(let i=0;i<np*2;i++){const r=i%2?r2:r1,a=(rot+i*180/np)*Math.PI/180;
  d+=(i?'L':'M')+n(cx+r*Math.cos(a))+' '+n(cy+r*Math.sin(a))+' ';}return d+'Z';}
const svg=inner=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768"><g stroke="${K}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
// ---------- scenery ----------
const frame=sky=>R(6,6,1012,756,28,sky);
const ground=(y,f,amp=24)=>P(`M6 ${y} Q 256 ${y-amp} 512 ${y} T 1018 ${y} L1018 734 Q1018 762 990 762 L34 762 Q6 762 6 734 Z`,f);
const cloud=(x,y,s=1)=>P(scallop(x,y,70*s,32*s,8,0.22),Wh);
const sun=(x,y,r=46)=>{let s='';for(let i=0;i<10;i++){const a=i*36*Math.PI/180;s+=L(n(x+(r+12)*Math.cos(a)),n(y+(r+12)*Math.sin(a)),n(x+(r+30)*Math.cos(a)),n(y+(r+30)*Math.sin(a)));}
  return s+C(x,y,r,c.amarillo)+E(x-15,y-6,5,7,K,'stroke="none"')+E(x+15,y-6,5,7,K,'stroke="none"')+P(`M${x-16} ${y+12} Q${x} ${y+26} ${x+16} ${y+12}`);};
const tree=(x,y,s=1,leaf=c.verde)=>R(x-14*s,y-90*s,28*s,90*s,8,c.marron)+P(scallop(x,y-150*s,80*s,70*s,9,0.16),leaf)+P(`M${x-30*s} ${y-150*s} q15 -15 30 0`)+P(`M${x+10*s} ${y-180*s} q12 -12 24 0`);
const bush=(x,y,s=1,f=c.verde)=>P(scallop(x,y,60*s,30*s,7,0.2),f);
const flower=(x,y,f=c.rosa,s=1)=>L(x,y,x,y+40*s)+P(`M${x} ${y+30*s} q-18 -14 -24 2 q14 8 24 -2Z`,c.verde)+P(scallop(x,y,16*s,16*s,5,0.35),f)+C(x,y,6*s,c.amarillo);
const grassTufts=(pts)=>pts.map(([x,y])=>P(`M${x-10} ${y} q4 -14 6 -18 M${x} ${y} q0 -16 2 -22 M${x+10} ${y} q-2 -14 -6 -18`)).join('');
const heart=(x,y,s=1,f=c.rojo)=>P(`M${x} ${y+18*s} C${x-40*s} ${y-8*s} ${x-18*s} ${y-34*s} ${x} ${y-14*s} C${x+18*s} ${y-34*s} ${x+40*s} ${y-8*s} ${x} ${y+18*s} Z`,f);
const acorn=(x,y,s=1)=>G(x,y,s,E(0,10,16,20,c.canela)+R(-3,-30,6,14,3,c.marron_oscuro)+P('M-21 2 Q-22 -20 0 -20 Q22 -20 21 2 Z',c.marron)+P('M-12 -4 l6 -8 M0 -4 l6 -8 M10 -2 l5 -7'));
const carnation=(x,y,s=1)=>G(x,y,s,P('M0 18 Q4 40 0 60')+P('M0 40 q-18 -10 -22 4 q14 6 22 -4Z',c.verde)+P(scallop(0,0,22,18,11,0.22),c.verde_lima)+P(scallop(0,-2,12,9,7,0.25),c.verde));
// ---------- characters ----------
const FOX=c.naranja, CR=c.crema, SOCK=c.marron_oscuro;
function foxHead(o={}){
  let s='';
  s+=P('M-66 -44 L-74 -128 L-18 -78 Z',FOX)+P('M-58 -58 L-64 -110 L-32 -80 Z',CR); // her right ear, straight
  s+=P('M18 -78 L50 -114 L104 -98 L66 -44 Z',FOX)+P('M50 -114 L104 -98 L70 -88 Z',SOCK)+P('M32 -76 L50 -102 L60 -92 L58 -56 Z',CR); // her LEFT ear, crooked tip
  s+=P('M-80 -30 C-84 -88 -30 -96 0 -94 C30 -96 84 -88 80 -30 C76 12 30 30 0 32 C-30 30 -76 12 -80 -30 Z',FOX);
  s+=P('M-76 -6 C-52 4 -24 6 0 -2 C24 6 52 4 76 -6 C64 20 30 32 0 32 C-30 32 -64 20 -76 -6 Z',CR);
  if(o.helmet) s+=P('M-84 -50 C-84 -118 84 -118 84 -50 Q0 -66 -84 -50 Z',o.helmet)+P('M-40 -98 q40 -16 80 0')+P('M-84 -50 Q-90 -10 -60 6');
  s+=E(-32,-40,10,14,K)+HL(-28,-46,4)+E(32,-40,10,14,K)+HL(36,-46,4);
  s+=E(0,-12,12,8,K)+HL(-4,-14,3)+P('M-14 4 Q-7 13 0 4 Q7 13 14 4');
  s+=E(-56,-14,9,6,c.rosa)+E(56,-14,9,6,c.rosa);
  return s;
}
function foxSit(){
  let s='';
  s+=P('M30 80 C120 90 160 30 140 -30 C130 -62 98 -62 96 -40 C110 0 90 50 30 50 Z',FOX);
  s+=P('M140 -30 C130 -62 98 -62 96 -40 C106 -28 122 -22 142 -20 Z',CR);
  s+=P('M-56 96 C-66 30 -40 -20 0 -24 C40 -20 66 30 56 96 Z',FOX);
  s+=P('M-24 -16 C-10 10 10 10 24 -16 C34 30 26 66 0 74 C-26 66 -34 30 -24 -16 Z',CR);
  s+=R(-40,36,26,58,13,FOX)+R(14,36,26,58,13,FOX);

<script>// Juniper's voice: shared by Learning Park and Coloring Park (same origin, localStorage 'juniperVoice').
const JVOICE = (() => {
  const OK = typeof window !== 'undefined' && 'speechSynthesis' in window;
  const KEY = 'juniperVoice';
  const DEF = { en: '', es: '', pitch: 1.3, rate: 1.0 };
  let cfg = Object.assign({}, DEF); try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };
  const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const L = v => (v.lang || '').replace('_', '-');
  const NOVELTY = /\b(bubbles|bells|whisper|albert|bad news|good news|zarvox|trinoids|boing|cellos|deranged|hysterical|jester|organ|superstar|wobble|ralph|junior|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley)\b/i;
  const MALE = /\b(fred|daniel|alex|tom|aaron|arthur|gordon|lee|oliver|rishi|evan|nathan|david|mark|guy|james|george|ryan|eric|christopher|roger|steffan|thomas|jorge|diego|juan|carlos|pablo|enrique|raul|alvaro)\b/i;
  const EN_PREF = ['ava', 'zoe', 'samantha', 'allison', 'susan', 'nicky', 'karen'];
  const EN_FEM = /\b(ava|zoe|samantha|allison|susan|nicky|karen|victoria|tessa|moira|fiona|veena|serena|kate|joelle|noelle|aria|jenny|zira|michelle|emma|ana|sonia|libby|google us english|google uk english female)\b/i;
  const ES_PREF = ['paulina', 'monica', 'marisol', 'angelica'];
  const bad = v => NOVELTY.test(v.name) || MALE.test(v.name);
  const quality = v => (/premium/i.test(v.name) ? 40 : /enhanced|natural|neural/i.test(v.name) ? 25 : 0);
  function score(v, pref, femRe, lang0) { const n = fold(v.name); if (bad(v)) return -1; let s = 0;
    const i = pref.findIndex(p => new RegExp('\\b' + p + '\\b').test(n)); if (i >= 0) s += 100 - i * 8; else if (femRe && femRe.test(v.name)) s += 40;
    s += quality(v); if (L(v) === lang0) s += 6; if (v.localService) s += 2; return s; }
  const all = () => OK ? speechSynthesis.getVoices() : [];
  const english = () => all().filter(v => /^en/i.test(L(v)));
  const spanish = () => all().filter(v => /^es/i.test(L(v)));
  function rank(list, pref, femRe, lang0) { return list.map(v => [v, score(v, pref, femRe, lang0)]).sort((a, b) => b[1] - a[1]); }
  function autoEn() { const r = rank(english(), EN_PREF, EN_FEM, 'en-US'); const ok = r.filter(x => x[1] >= 0); return (ok.find(x => x[1] > 0) || ok.find(x => L(x[0]) === 'en-US') || ok[0] || r[0] || [null])[0]; }
  function autoEs() { const r = rank(spanish(), ES_PREF, null, 'es-MX'); const ok = r.filter(x => x[1] >= 0); return (ok[0] || r[0] || [null])[0]; }
  const byName = (list, n) => n ? list.find(v => v.name === n) || null : null;
  let EN = null, ES = null;
  function refresh() { EN = byName(english(), cfg.en) || autoEn(); ES = byName(spanish(), cfg.es) || autoEs(); return all().length; }
  if (OK) { refresh(); speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', refresh) : (speechSynthesis.onvoiceschanged = refresh);
    // Safari sometimes loads voices late and never fires voiceschanged: retry a few times
    let tries = 0; const t = setInterval(() => { if (refresh() || ++tries > 20) { if (all().length || tries > 20) clearInterval(t); } }, 250); }
  function utter(text, es, o = {}) { const u = new SpeechSynthesisUtterance(text); const v = es ? ES : EN;
    u.lang = v ? v.lang : (es ? 'es-MX' : 'en-US'); if (v) u.voice = v;
    u.pitch = o.pitch != null ? o.pitch : cfg.pitch; u.rate = o.rate != null ? o.rate : (es ? Math.max(0.7, cfg.rate - 0.08) : cfg.rate); return u; }
  function test(name, es) { if (!OK) return; try { speechSynthesis.cancel(); } catch (e) {} const v = (es ? spanish() : english()).find(x => x.name === name); const u = new SpeechSynthesisUtterance(es ? '¡Hola Aspen! ¡Soy Juniper!' : "Hi Aspen! I'm Juniper!");
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = es ? 'es-MX' : 'en-US'; u.pitch = cfg.pitch; u.rate = cfg.rate; speechSynthesis.speak(u); }
  // ---------- grown-up panel ----------
  const CSS = `#jvPanel{position:fixed;inset:0;z-index:200;background:rgba(40,30,20,.5);display:none;align-items:center;justify-content:center;font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;color:#3b2a20}
#jvPanel.on{display:flex}#jvPanel .jvc{background:#fff;border-radius:26px;width:min(620px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 0 #e8d3bd}
#jvPanel h2{margin:0;padding:16px 20px 4px;font-size:26px;color:#e0631a}#jvPanel .jvsub{padding:0 20px 8px;font-size:14px;opacity:.7}
#jvPanel .jvbody{overflow-y:auto;padding:0 16px 10px;-webkit-overflow-scrolling:touch}
#jvPanel .jvrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:3px solid transparent;margin:4px 0;background:#fff8ef;cursor:pointer}
#jvPanel .jvrow.sel{border-color:#43a047;background:#e8f5e9}#jvPanel .jvrow .nm{flex:1;font-weight:800;font-size:17px}#jvPanel .jvrow small{font-weight:600;opacity:.6;margin-left:6px}
#jvPanel .jvrow .rec{color:#f9a825}#jvPanel button.jvt{border:0;border-radius:12px;background:#1e88e5;color:#fff;font:inherit;font-weight:800;padding:8px 14px}
#jvPanel h3{margin:14px 6px 4px;font-size:18px}#jvPanel .jvsl{display:flex;align-items:center;gap:10px;padding:4px 8px;font-weight:800}#jvPanel input[type=range]{flex:1;height:30px}
#jvPanel select{font:inherit;font-size:16px;padding:6px;border-radius:10px;flex:1;min-width:0}
#jvPanel .jvfoot{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:2px solid #f3e6d6}
#jvPanel .jvfoot button{border:0;border-radius:14px;font:inherit;font-weight:900;font-size:18px;padding:10px 18px;background:#eee}#jvPanel .jvfoot .done{background:#43a047;color:#fff}
.jvgear{opacity:.35}.jvgear svg{width:30px!important;height:30px!important}`;
  let panel = null, openedAt = 0;
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function render() { if (!panel) return; refresh(); const auto = autoEn(); const en = english();
    const ranked = rank(en, EN_PREF, EN_FEM, 'en-US').map(x => x[0]);
    const rows = [`<div class="jvrow${!cfg.en ? ' sel' : ''}" data-n=""><span class="nm">Automatic (best girl voice)<small>${auto ? esc(auto.name) : 'device default'}</small></span><button class="jvt" data-t="${auto ? esc(auto.name) : ''}">Test</button></div>`]
      .concat(ranked.map(v => `<div class="jvrow${cfg.en === v.name ? ' sel' : ''}" data-n="${esc(v.name)}"><span class="nm">${score(v, EN_PREF, EN_FEM, 'en-US') >= 60 ? '<span class="rec">★</span> ' : ''}${esc(v.name)}<small>${esc(L(v))}</small></span><button class="jvt" data-t="${esc(v.name)}">Test</button></div>`));
    const es = rank(spanish(), ES_PREF, null, 'es-MX').map(x => x[0]);
    panel.querySelector('.jvbody').innerHTML = `<h3>English voice</h3>${en.length ? rows.join('') : '<div class="jvsub">No English voices found on this device yet.</div>'}
      <h3>Brightness (pitch)</h3><div class="jvsl"><span>Low</span><input type="range" id="jvPitch" min="0.8" max="1.8" step="0.05" value="${cfg.pitch}"><span>High</span><b id="jvPv">${(+cfg.pitch).toFixed(2)}</b></div>
      <h3>Speed</h3><div class="jvsl"><span>Slow</span><input type="range" id="jvRate" min="0.7" max="1.2" step="0.05" value="${cfg.rate}"><span>Fast</span><b id="jvRv">${(+cfg.rate).toFixed(2)}</b></div>
      <h3>Spanish voice</h3><div class="jvsl"><select id="jvEs"><option value="">Automatic${ES ? ' (' + esc(ES.name) + ')' : ''}</option>${es.map(v => `<option value="${esc(v.name)}"${cfg.es === v.name ? ' selected' : ''}>${esc(v.name)} (${esc(L(v))})</option>`).join('')}</select><button class="jvt" id="jvEsT">Test</button></div>`;
    panel.querySelectorAll('.jvrow').forEach(r => r.onclick = e => { if (e.target.classList.contains('jvt')) return; cfg.en = r.dataset.n; save(); refresh(); render(); test(EN ? EN.name : '', false); });
    panel.querySelectorAll('.jvrow .jvt').forEach(b => b.onclick = e => { e.stopPropagation(); test(b.dataset.t, false); });
    const pi = panel.querySelector('#jvPitch'); pi.oninput = () => { cfg.pitch = +pi.value; panel.querySelector('#jvPv').textContent = cfg.pitch.toFixed(2); save(); }; pi.onchange = () => test(EN ? EN.name : '', false);
    const ra = panel.querySelector('#jvRate'); ra.oninput = () => { cfg.rate = +ra.value; panel.querySelector('#jvRv').textContent = cfg.rate.toFixed(2); save(); }; ra.onchange = () => test(EN ? EN.name : '', false);
    const se = panel.querySelector('#jvEs'); se.onchange = () => { cfg.es = se.value; save(); refresh(); test(ES ? ES.name : '', true); };
    panel.querySelector('#jvEsT').onclick = () => test(ES ? ES.name : '', true); }
  function open() { if (!panel) { const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      panel = document.createElement('div'); panel.id = 'jvPanel'; panel.innerHTML = `<div class="jvc"><h2>Juniper's Voice</h2><div class="jvsub">For grown-ups. Pick a voice and tap Test. Saved on this iPad. Tip: Settings → Accessibility → Spoken Content → Voices can download Premium voices like Ava or Zoe.</div><div class="jvbody"></div><div class="jvfoot"><button class="reset">Reset</button><button class="done">Done</button></div></div>`;
      document.body.appendChild(panel);
      panel.querySelector('.done').onclick = close; panel.querySelector('.reset').onclick = () => { cfg = Object.assign({}, DEF); save(); refresh(); render(); };
      panel.addEventListener('click', e => { if (e.target === panel && Date.now() - openedAt > 600) close(); }); }
    openedAt = Date.now(); render(); panel.classList.add('on'); }
  function close() { if (panel) panel.classList.remove('on'); try { speechSynthesis.cancel(); } catch (e) {} }
  // gear: opens only on 3 quick taps or a 1-second long-press, so little hands don't wander in
  function gear(el) { if (!el) return; el.classList.add('jvgear'); el.setAttribute('aria-label', 'Grown-up voice settings');
    el.innerHTML = '<svg viewBox="0 0 48 48"><path d="M24 4l4 5 6-2 1 6 6 2-2 6 5 4-5 4 2 6-6 2-1 6-6-2-4 5-4-5-6 2-1-6-6-2 2-6-5-4 5-4-2-6 6-2 1-6 6 2z" fill="#bdbdbd" stroke="#666" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="7" fill="#fff" stroke="#666" stroke-width="2.5"/></svg>';
    let taps = [], timer = null;
    el.addEventListener('pointerdown', e => { e.stopPropagation(); timer = setTimeout(() => { timer = null; taps = []; open(); }, 1000); });
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener('pointerup', e => { e.stopPropagation(); if (!timer) return; cancel(); const now = Date.now(); taps = taps.filter(t => now - t < 1200); taps.push(now); if (taps.length >= 3) { taps = []; open(); } });
    el.addEventListener('pointerleave', cancel); el.addEventListener('pointercancel', cancel); el.addEventListener('click', e => e.stopPropagation()); }
  return { ok: OK, refresh, utter, test, open, close, gear, en: () => EN, es: () => ES, cfg: () => cfg, english, spanish, autoEn, autoEs };

function dieSvg(n) { const P = { 1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[28, 28], [50, 50], [72, 72]], 4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]], 6: [[30, 26], [70, 26], [30, 50], [70, 50], [30, 74], [70, 74]] }[n] || [];
